<!doctype html><html lang="ja"><head><meta charset="utf-8">
<title>旅のノート</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅のノート">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#EBF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1817" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>旅のノート アプリ版</title>
<style>
/* スマホアプリ想定：下にタブバー、上に旅行名。外部のフォントや地図は使わず、すべて端末の中で動く（オフライン対応）。
   日にちの色：1日目=紅 2日目=藍 3日目=山吹 4日目=若竹 5日目=江戸紫 6日目=珊瑚 7日目=群青（以降くり返し） */
:root{
  --ground:#EBF1F0; --paper:#FFFFFF; --ink:#13302E; --muted:#58706D; --line:#D3E0DD;
  --accent:#0E6C74; --accent-soft:#D8EBEB;
  --sea:#D3E6E8; --land:#F4EFE2; --land-line:#C9BE9F;
  --c1:#C2364A; --c2:#1F68AE; --c3:#B47905; --c4:#3C8A3A; --c5:#7A4FA3; --c6:#D0602F; --c7:#24508C;
  --warn:#B4322A; --warn-soft:#F7E2E0; --ok:#2C7A4B;
  --shadow:0 1px 2px rgba(19,48,46,.06),0 8px 22px rgba(19,48,46,.08);
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --display:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --tabh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#0B1817;--paper:#132322;--ink:#E2EEEC;--muted:#93ABA8;--line:#253E3B;--accent:#5FC3C9;--accent-soft:#163939;
  --sea:#0E282C;--land:#1E2C28;--land-line:#3A4F47;--c1:#F07587;--c2:#74A9EC;--c3:#E7B44A;--c4:#7CC77A;--c5:#B996E0;--c6:#F2955F;--c7:#7FA3E0;
  --warn:#F08A7F;--warn-soft:#3A1F1C;--ok:#7CCB98;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#0B1817;--paper:#132322;--ink:#E2EEEC;--muted:#93ABA8;--line:#253E3B;--accent:#5FC3C9;--accent-soft:#163939;
  --sea:#0E282C;--land:#1E2C28;--land-line:#3A4F47;--c1:#F07587;--c2:#74A9EC;--c3:#E7B44A;--c4:#7CC77A;--c5:#B996E0;--c6:#F2955F;--c7:#7FA3E0;
  --warn:#F08A7F;--warn-soft:#3A1F1C;--ok:#7CCB98;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* 上のバー */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:54px}
.bar .back{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 4px;cursor:pointer;white-space:nowrap}
.bar .ttl{flex:1;min-width:0}
.bar .ttl b{display:block;font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{display:block;color:var(--muted);font-size:12px}
.toptabs{display:none}
/* 下のタブバー（スマホ） */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--paper) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto;height:var(--tabh)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){.tabbar{display:none}.toptabs{display:flex;gap:2px}.toptabs button{border:0;background:none;padding:7px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}.toptabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}}

.page{max-width:980px;margin:0 auto;padding:18px 16px calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){.page{padding-bottom:56px}}
.sub{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;min-height:36px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.fill{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.fill:hover{color:var(--paper);filter:brightness(1.07)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger.fill{background:var(--warn);color:var(--paper)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{width:100%;padding:12px;font-size:15px}
.ib{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:8px;cursor:pointer}
.ib:hover{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:16px}
.tag{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.cand{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* フォーム */
.form{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;min-width:0;font-size:16px}
textarea{min-height:64px;resize:vertical}
.tsel{display:flex;gap:4px}.tsel select{width:auto}
.warn{margin:0;padding:7px 11px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:700}
.note{margin:0;padding:9px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13px}
.inbox{background:var(--ground);border-radius:12px;padding:12px}

/* 旅行の一覧 */
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.trip{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.trip .band{height:8px;background:var(--tc)}
.trip .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.trip h3{font-size:19px}
.trip .cd{font-family:var(--num);font-weight:800;color:var(--accent)}

/* 日程 */
.days{display:flex;flex-direction:column;gap:14px}
.day{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.day header{padding:12px 16px;border-left:5px solid var(--dc);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.day header .k{font-family:var(--num);font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--dc)}
.day header h3{font-size:17px}
.day ul{list-style:none;margin:0;padding:0 16px}
.day li{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.day li.full{display:block}
.day .t{font-family:var(--num);font-weight:800;color:var(--dc)}
.day .t small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.day .ti{font-weight:700;overflow-wrap:anywhere}
.day .mv .ti{font-weight:500;color:var(--muted)}
.day .no{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.day .kind{font-size:11px;color:var(--muted);font-weight:700;margin-right:4px}
.day .foot{padding:8px 16px 14px}
.day .acts{display:flex}

/* 場所 */
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.spot{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.spot h3{font-size:17px;overflow-wrap:anywhere}
.spot .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.spot p{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.assign{display:flex;flex-direction:column;gap:8px;background:var(--ground);border-radius:12px;padding:10px 12px}
.assign .btn small{font-weight:500}

/* 地図 */
.mapbox{position:relative;background:var(--sea);border-radius:16px;overflow:hidden;border:1px solid var(--line);height:min(68vh,620px);touch-action:none}
.mapbox svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;cursor:grab}
.mapbox.pick svg{cursor:crosshair}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:.8;stroke-linejoin:round}
.city{fill:var(--muted);font-weight:700;paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
.route{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.route.dim{opacity:.12}
.pin{cursor:pointer}
.pin circle{stroke:var(--paper)}
.pin.cand circle{fill:var(--paper);stroke:var(--muted)}
.pin text.n{fill:#fff;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none;font-family:var(--num)}
.pin.cand text.n{fill:var(--muted)}
.pin .lab{fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--land);stroke-linejoin:round;pointer-events:none}
.pin.dim{opacity:.18}
.pin.on circle{stroke:var(--ink)}
.cross circle{fill:none;stroke:var(--warn)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:800;font-size:19px;cursor:pointer;box-shadow:var(--shadow)}
.attr{position:absolute;left:8px;bottom:6px;font-size:10px;color:var(--muted)}
.pickbar{position:absolute;left:10px;right:10px;top:10px;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;box-shadow:var(--shadow)}
.pickbar b{flex:1;min-width:160px}
.pickbar .btn{min-height:32px;padding:5px 12px}
.selcard{display:flex;flex-direction:column;gap:6px}

/* 割り勘 */
.total{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:baseline}
.total b{font-family:var(--num);font-weight:800;font-size:28px}
.pays{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pays li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.pays .amt{margin-left:auto;font-family:var(--num);font-weight:800;font-size:18px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);border-radius:999px;padding:4px 4px 4px 12px;font-weight:700;font-size:14px}
.mchip.fixed{padding-right:12px}
.mchip button{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:50%;cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px}
.checks input{width:18px;height:18px}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ex .a{font-family:var(--num);font-weight:800}
.ex .s{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.ex .x{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted)}.tbl .r{text-align:right;font-family:var(--num)}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--warn);font-weight:700}

/* 通知 */
.nset{display:flex;flex-direction:column;gap:0}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
.nrow b{font-size:15px}
.nrow small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.nrow .ctl{display:flex;gap:6px;align-items:center}
.nrow select{width:auto}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.nlist li:first-child{border-top:0}
.nlist .when{font-family:var(--num);font-weight:800;color:var(--accent);font-size:13px}
.nlist .when small{display:block;color:var(--muted);font-weight:600}
.nlist .past{opacity:.45}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-size:13.5px;z-index:40;max-width:calc(100vw - 32px);display:flex;gap:10px;align-items:center}
@media (min-width:900px){.toast{bottom:24px}}
.toast button{border:0;background:var(--accent);color:var(--paper);border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer;white-space:nowrap}
.banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:50;background:var(--paper);color:var(--ink);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 14px;width:min(380px,calc(100vw - 24px));display:flex;gap:12px;align-items:flex-start}
.banner .ic{width:36px;height:36px;border-radius:9px;background:var(--accent);flex:none;display:grid;place-items:center;color:var(--paper);font-weight:800}
.banner small{display:block;color:var(--muted);font-size:11.5px}
.copybox{width:100%;min-height:160px;font-size:13px}
@media (prefers-reduced-motion:reduce){.sw span,.sw span::after{transition:none}}
</style>

<header class="bar"><div class="in" id="bar"></div></header>
<main id="app"></main>
<nav class="tabbar" id="tabbar" aria-label="ページ" hidden><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* ================= 端末の機能を呼ぶ窓口 =================
   アプリ（Capacitor）で動いているときは iPhone の通知・共有・マップを使い、
   ブラウザでは代わりの動き（画面内の表示・コピー・Googleマップ）にする */
const Native={
  isApp:!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()),
  isIOS:/iPhone|iPad|iPod/.test(navigator.userAgent),
  plug(n){const C=window.Capacitor;if(!C)return null;return (C.Plugins&&C.Plugins[n])||(C.registerPlugin?C.registerPlugin(n):null)},
  /* 通知をすべて入れ直す。list:[{at:Date,title,body}] */
  async schedule(list){const LN=this.plug("LocalNotifications");if(!this.isApp||!LN)return false;
    try{const p=await LN.checkPermissions();if(p.display!=="granted")return "denied";
      const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
      const fut=list.filter(n=>n.at>new Date()).slice(0,60); /* iOSは同時に64件まで */
      if(fut.length)await LN.schedule({notifications:fut.map((n,i)=>({id:i+1,title:n.title,body:n.body,schedule:{at:n.at}}))});return true}catch(e){return false}},
  /* 通知の許可の状態："granted"（許可）/"denied"（拒否）/"prompt"（まだ聞いていない）/"web"（ブラウザ） */
  async perm(ask){const LN=this.plug("LocalNotifications");if(!this.isApp||!LN)return "web";
    try{let p=await LN.checkPermissions();if(ask&&p.display!=="granted"&&p.display!=="denied")p=await LN.requestPermissions();return p.display==="granted"?"granted":p.display==="denied"?"denied":"prompt"}catch(e){return "prompt"}},
  async testNotify(n){const LN=this.plug("LocalNotifications");
    if(this.isApp&&LN){try{if(await this.perm(true)!=="granted")return "denied";await LN.schedule({notifications:[{id:9999,title:n.title,body:n.body,schedule:{at:new Date(Date.now()+5000)}}]});return "app"}catch(e){return false}}
    return "web"},
  async share(title,text){const SH=this.plug("Share");
    if(this.isApp&&SH){try{await SH.share({title,text});return "shared"}catch(e){return false}}
    try{await navigator.clipboard.writeText(text);return "copied"}catch(e){return false}},
  dirUrl(s){return this.isIOS&&this.isApp?`maps://?daddr=${s.lat},${s.lon}`:`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}`},
  mapUrl(s){return `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`}
};

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};

function items(t,date){return Object.entries(t.items||{}).map(([id,v])=>({id,...v})).filter(x=>!date||x.date===date).sort((a,b)=>{const ka=timeKey(a.time),kb=timeKey(b.time);if(ka!=null&&kb!=null&&ka!==kb)return ka-kb;return (a.order||0)-(b.order||0)})}
function spots(t){return Object.entries(t.spots||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(a.created||0)-(b.created||0))}
function spotDay(t,id){const ds=dates(t);for(let i=0;i<ds.length;i++)if(Object.values(t.items||{}).some(x=>x.spot===id&&x.date===ds[i]))return i+1;return 0}
function nextOrder(t,date){const its=items(t,date);return its.length?Math.max(...its.map(x=>x.order||0))+1:1}
/* 入れられない時間：移動中／初日の到着前／最終日の帰りの出発以降 */
function conflict(t,date,time,skip){const k=timeKey(time);if(k==null)return"";const ds=dates(t);
  const mv=items(t,date).filter(x=>x.id!==skip&&x.kind==="move"&&timeKey(x.time)!=null);
  for(const m of mv){const a=timeKey(m.time),b=timeKey(m.arrive);if(b!=null&&b>a&&k>=a&&k<b)return `移動中です（${m.title} ${m.time}〜${m.arrive}）`}
  if(date===ds[0]){const f=mv.find(m=>timeKey(m.arrive)!=null&&timeKey(m.arrive)>timeKey(m.time));if(f&&k<timeKey(f.arrive))return `到着前です（${f.arrive}着）`}
  if(date===ds[ds.length-1]&&ds.length>1&&mv.length){const l=mv[mv.length-1];if(k>=timeKey(l.time))return `帰りの出発（${l.time}）より後です`}
  return""}
function countdown(t){const today=ymd(new Date());if(!t.start)return"";if(today<t.start){const n=Math.round((toD(t.start)-toD(today))/864e5);return `出発まで ${n}日`}if(today<=t.end)return "旅行中";return "おわった旅"}

/* ================= 通知 ================= */
const NDEF={before:30,eve:{on:true,time:"20:00"},morn:{on:false,time:"07:00"},pre:{on:false,days:7}};
function nset(t){return Object.assign({},NDEF,t.notif||{},{eve:{...NDEF.eve,...(t.notif||{}).eve},morn:{...NDEF.morn,...(t.notif||{}).morn},pre:{...NDEF.pre,...(t.notif||{}).pre}})}
function at(date,time){const [h,m]=time.split(":").map(Number);const d=toD(date);d.setHours(h,m,0,0);return d}
function notifList(t){const n=nset(t),ds=dates(t),out=[];if(!ds.length)return out;
  if(n.pre.on){const d=toD(ds[0]);d.setDate(d.getDate()-n.pre.days);d.setHours(19,0,0,0);out.push({at:d,title:`${t.title}まであと${n.pre.days}日`,body:"予約や持ち物を確認しておきましょう"})}
  ds.forEach((date,i)=>{const its=items(t,date),first=its.find(x=>x.time);
    if(n.eve.on&&its.length){const d=at(date,n.eve.time);d.setDate(d.getDate()-1);out.push({at:d,title:`明日は${i+1}日目（${md(date)}）`,body:first?`最初は ${first.time} ${first.title}${its.length>1?` ほか${its.length-1}件`:""}`:`予定 ${its.length}件`})}
    if(n.morn.on&&its.length)out.push({at:at(date,n.morn.time),title:`今日の予定（${i+1}日目）`,body:its.slice(0,3).map(x=>`${x.time||""} ${x.title}`.trim()).join(" / ")+(its.length>3?` ほか${its.length-3}件`:"")});
    if(n.before>0)its.forEach(x=>{if(!x.time)return;const d=at(date,x.time);d.setMinutes(d.getMinutes()-n.before);out.push({at:d,title:`${n.before>=60?n.before/60+"時間":n.before+"分"}後：${x.title}`,body:`${x.time}${x.note?"　"+x.note:""}`})});
  });
  return out.sort((a,b)=>a.at-b.at)}
/* アプリでは保存のたびに通知を入れ直す（全旅行ぶん） */
let schedT=0;function schedNotif(){if(!Native.isApp)return;clearTimeout(schedT);schedT=setTimeout(()=>Native.schedule(Object.values(DB.trips).flatMap(notifList)),800)}
function showBanner(n){const b=$("banner");b.innerHTML=`<span class="ic">旅</span><div><small>旅のノート ・ いま</small><b></b><div class="bd"></div></div>`;b.querySelector("b").textContent=n.title;b.querySelector(".bd").textContent=n.body;b.hidden=false;setTimeout(()=>b.hidden=true,5000)}

   <button class="ib" data-a="about" style="align-self:center">このアプリについて・プライバシー</button>`;

function tripForm(){const t=S.tripForm==="edit"?T():{title:"",start:"",end:"",people:""};

   ${S.tripForm==="edit"?(S.confirm==="trip"?`<div class="inbox row"><span class="sub" style="color:var(--warn)">この旅行を予定・場所・割り勘ごと削除しますか？</span><button class="btn danger fill" type="button" data-a="delTripYes">削除</button><button class="btn" type="button" data-a="noConfirm">やめる</button></div>`:`<button class="btn danger" type="button" data-a="delTrip" style="align-self:flex-start">この旅行を削除</button>`):""}</form>`}

/* ================= 画面：日程 ================= */
function timeSel(id,val){const m=/^(\d{1,2}):(\d{2})/.exec(val||"");const h=m?String(+m[1]):"",mi=m?m[2]:"00";
  return `<span class="tsel"><select id="${id}_h" aria-label="時">${["",...Array.from({length:24},(_,k)=>String(k))].map(v=>`<option value="${v}" ${v===h?"selected":""}>${v===""?"時間なし":v+"時"}</option>`).join("")}</select><select id="${id}_m" aria-label="分">${["00","15","30","45"].map(v=>`<option ${v===mi?"selected":""}>${v}</option>`).join("")}</select></span>`}
const readTime=id=>{const h=$(id+"_h")?.value;return !h?"":pad(h)+":"+$(id+"_m").value};
function planView(t){const ds=dates(t);
  return `${!Object.keys(t.items||{}).length?`<div class="empty"><b>AIに下書きを作ってもらう</b><span>行き先と好みを選ぶと、日程と行きたい場所の候補をAIが考えます。あとからこの画面で自由に直せます。</span><button class="btn fill" data-a="aiOpen" data-k="plan">AIで日程と候補を作る</button></div>`:""}<div class="row" style="justify-content:space-between"><span class="sub">予定は時間順に並びます</span><span class="row"><button class="btn" data-a="aiOpen" data-k="plan">AIで作り直す</button><button class="btn" data-a="copyPlan">LINEに送る文章を作る</button></span></div>
  ${S.copy?`<div class="card form"><span class="lbl">この文章をコピーして LINE などに貼れます</span><textarea class="copybox" id="copybox" readonly>${esc(S.copy)}</textarea><div class="row"><button class="btn fill" data-a="copyAgain">コピー</button><button class="btn" data-a="closeCopy">閉じる</button></div></div>`:""}
  <div class="days">${ds.map((date,k)=>{const i=k+1,its=items(t,date);return `<section class="day" style="--dc:${dayColor(i)}"><header><span class="k">DAY ${i}</span><h3>${md(date)}（${wd(date)}）</h3>${t.dayInfo?.[date]?.area?`<span class="sub">${esc(t.dayInfo[date].area)}</span>`:""}</header>
   <ul>${its.map((x,j)=>(j?gapRow(t,its[j-1],x):"")+(S.edit===x.id?`<li class="full">${itemForm(t,date,x)}</li>`:itemRow(t,x))).join("")}${S.edit==="new:"+date?`<li class="full">${itemForm(t,date,null)}</li>`:""}${!its.length&&S.edit!=="new:"+date?`<li class="full"><span class="sub">まだ予定がありません</span></li>`:""}</ul>
   ${S.edit==="new:"+date?"":`<div class="foot"><button class="btn" data-a="addItem" data-date="${date}">＋ 予定を追加</button></div>`}</section>`}).join("")}</div>`}
/* 予定と予定の間の移動の目安（直線距離×1.3を道のりとみなす。徒歩4.5km/h、車・電車は平均30km/h＋10分） */
function distKm(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmtMin=m=>m>=60?`${Math.floor(m/60)}時間${m%60?Math.round(m%60)+"分":""}`:`${Math.max(1,Math.round(m))}分`;
function gapRow(t,a,b){const sa=a.spot&&t.spots?.[a.spot],sb=b.spot&&t.spots?.[b.spot];if(!sa||!sb||sa.lat==null||sb.lat==null||a.kind==="move"||b.kind==="move")return"";
  const km=distKm(sa,sb)*1.3;if(km<0.05)return"";const walk=km/4.5*60,ride=km/30*60+10;
  const tx=km<1.5?`歩いて約${fmtMin(walk)}`:km<4?`歩いて約${fmtMin(walk)} ・ 車や電車で約${fmtMin(ride)}`:`車や電車で約${fmtMin(ride)}`;
  let warn="";const ka=timeKey(a.time),kb=timeKey(b.time);if(ka!=null&&kb!=null){const need=(sa.minutes||60)+(km<1.5?walk:ride);if(ka+need>kb)warn=`<span style="color:var(--warn);font-weight:700"> ・ 時間が足りないかも（${sa.minutes?`滞在${fmtMin(sa.minutes)}＋`:"滞在1時間＋"}移動）</span>`}
  return `<li class="full" style="padding:4px 0 4px 62px;border-top:0;font-size:12px;color:var(--muted)">↓ 約${km.toFixed(km<10?1:0)}km ・ ${tx}${warn}</li>`}
function itemRow(t,x){const s=x.spot&&t.spots?.[x.spot];
  return `<li class="${x.kind==="move"?"mv":""}"><span class="t">${esc(x.time||"—")}${x.arrive?`<small>${esc(x.arrive)}着</small>`:""}</span>
   <span><span class="kind">${KINDS[x.kind]||""}</span><span class="ti">${esc(x.title)}</span>${x.note?`<span class="no">${esc(x.note)}</span>`:""}${s&&s.lat!=null?`<span class="no"><button class="ib" style="padding:0" data-a="showSpot" data-id="${x.spot}">地図で見る</button></span>`:""}
   ${S.confirm===x.id?`<span class="row" style="margin-top:6px"><span class="sub" style="color:var(--warn)">削除しますか？</span><button class="btn danger" data-a="delItemYes" data-id="${x.id}">削除</button><button class="btn" data-a="noConfirm">やめる</button></span>`:""}</span>
   <span class="acts">${S.confirm===x.id?"":`<button class="ib" data-a="editItem" data-id="${x.id}">編集</button><button class="ib" data-a="delItem" data-id="${x.id}">削除</button>`}</span></li>`}
function itemForm(t,date,x){const v=x||{time:"",kind:"see",title:"",note:"",spot:"",arrive:""};

   <div class="row"><div class="field"><label for="f_date">日にち</label><select id="f_date" style="width:auto">${dates(t).map((d,k)=>`<option value="${d}" ${d===date?"selected":""}>${k+1}日目 ${md(d)}（${wd(d)}）</option>`).join("")}</select></div><div class="field"><span class="lbl">時間</span>${timeSel("f_t",v.time)}</div><div class="field" style="flex:1 1 110px"><label for="f_kind">種類</label><select id="f_kind">${Object.entries(KINDS).map(([k,l])=>`<option value="${k}" ${v.kind===k?"selected":""}>${l}</option>`).join("")}</select></div></div>
   ${spots(t).length?`<div class="field"><label for="f_spot">行きたい場所から選ぶ（任意）</label><select id="f_spot"><option value="">選ばない</option>${spots(t).map(s=>`<option value="${s.id}" ${v.spot===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div>`:""}
   <div class="field"><label for="f_title">内容</label><input type="text" id="f_title" maxlength="60" value="${esc(v.title)}" placeholder="例：新幹線で名古屋 → 東京"></div>
   <div class="field"><label for="f_note">メモ（任意）</label><input type="text" id="f_note" maxlength="140" value="${esc(v.note)}" placeholder="予約番号、集合場所など"></div>

function spotsView(t){const ss=spots(t);

function dayTag(t,id){const d=spotDay(t,id);return d?`<span class="tag" style="background:color-mix(in srgb,${dayColor(d)} 16%,transparent);color:${dayColor(d)}">${d}日目</span>`:`<span class="tag cand">候補</span>`}
function spotCard(t,s){return `<article class="spot"><div class="meta">${dayTag(t,s.id)}${s.cat&&CATS[s.cat]?`<span class="tag">${CATS[s.cat]}</span>`:""}${s.area?`<span>${esc(s.area)}</span>`:""}${s.book?`<span class="tag warn">要予約</span>`:""}${s.minutes?`<span>約${s.minutes>=60?(s.minutes/60).toFixed(s.minutes%60?1:0)+"時間":s.minutes+"分"}</span>`:""}${s.lat==null?`<span class="tag warn">位置なし</span>`:""}</div>
  <h3>${esc(s.name)}</h3>${s.note?`<p>${esc(s.note)}</p>`:""}${s.fee?`<span class="sub">料金：${esc(s.fee)}</span>`:""}
  ${S.confirm===s.id?`<div class="inbox row"><span class="sub" style="color:var(--warn)">削除しますか？（日程の予定は残ります）</span><button class="btn danger" data-a="delSpotYes" data-id="${s.id}">削除</button><button class="btn" data-a="noConfirm">やめる</button></div>`:""}
  ${planBtns(t,s)}

function planBtns(t,s){const d=spotDay(t,s.id);

const proj=(lat,lon)=>[(lon-GEO.W0)*GEO.C*GEO.K,(GEO.N0-lat)*GEO.K];

   :(spots(t).some(s=>s.lat!=null)?`<p class="sub">ピンを押すと詳しい情報が出ます。線はその日に回る順番です。</p>`:`<div class="empty"><b>まだピンがありません</b><span>「場所」タブで行きたい場所を追加して、地図の位置を決めるとここに出ます。</span></div>`))

function fitVB(t){const pts=spots(t).filter(s=>s.lat!=null).map(s=>proj(s.lat,s.lon));
  if(!pts.length)return [0,0,GEO.vw,GEO.vh];
  let x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0])),y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1]));
  const w=Math.max(x1-x0,14)*1.35,h=Math.max(y1-y0,14)*1.35;return [(x0+x1)/2-w/2,(y0+y1)/2-h/2,w,h]}
/* 表示範囲を枠の縦横比に合わせる */
function setVB(vb){const box=$("mapbox");if(!box)return;const r=box.getBoundingClientRect();const asp=r.height/r.width||1;
  let [x,y,w,h]=vb;const cx=x+w/2,cy=y+h/2;if(h/w>asp)w=h/asp;else h=w*asp;
  w=Math.min(Math.max(w,3),GEO.vw*1.6);h=w*asp;S.vb=[cx-w/2,cy-h/2,w,h];$("svg").setAttribute("viewBox",S.vb.map(v=>v.toFixed(2)).join(" "));drawOverlay()}
function drawOverlay(){const t=T(),svg=$("svg");if(!svg||!t)return;const r=svg.getBoundingClientRect();const u=S.vb[2]/r.width; /* 画面1pxあたりの地図の長さ */
  const ds=dates(t);let h="";
  /* 町の名前 */
  const lv=S.vb[2]<260?2:S.vb[2]<900?1:0;
  if(lv)CITIES.forEach(([n,la,lo,tier])=>{if(tier>lv)return;const [x,y]=proj(la,lo);h+=`<text class="city" x="${x}" y="${y}" font-size="${11*u}" stroke-width="${3*u}" text-anchor="middle">${n}</text>`});
  /* 日ごとの線 */
  ds.forEach((d,k)=>{const pts=items(t,d).filter(x=>x.spot&&t.spots[x.spot]&&t.spots[x.spot].lat!=null).map(x=>proj(t.spots[x.spot].lat,t.spots[x.spot].lon));if(pts.length<2)return;
    let p=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [ax,ay]=pts[i-1],[bx,by]=pts[i],mx=(ax+bx)/2,my=(ay+by)/2,dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy)||1,kk=l*.12;p+=` Q${mx-dy/l*kk} ${my+dx/l*kk} ${bx} ${by}`}
    h+=`<path class="route${S.mapDay&&S.mapDay!==k+1?" dim":""}" d="${p}" stroke="${dayColor(k+1)}" stroke-width="${3*u}"/>`});
  /* ピン */
  spots(t).forEach((s,i)=>{if(s.lat==null)return;const [x,y]=proj(s.lat,s.lon);const d=spotDay(t,s.id);const on=S.sel===s.id,dim=S.mapDay&&d!==S.mapDay;const R=(on?11:9)*u;
    h+=`<g class="pin${d?"":" cand"}${dim?" dim":""}${on?" on":""}" data-pin="${s.id}" tabindex="0" role="button" aria-label="${esc(s.name)}"><circle cx="${x}" cy="${y}" r="${R}" stroke-width="${2*u}" ${d?`fill="${dayColor(d)}"`:""}/><text class="n" x="${x}" y="${y}" font-size="${9.5*u}">${i+1}</text><text class="lab" x="${x+R+3*u}" y="${y+4*u}" font-size="${11*u}" stroke-width="${3*u}">${esc(s.name)}</text></g>`});
  const mark=S.pick&&S.pick.ll||(!S.pick&&S.tapLL);if(mark){const [x,y]=proj(mark.lat,mark.lon);h+=`<g class="cross"><circle cx="${x}" cy="${y}" r="${10*u}" stroke-width="${3*u}"/><circle cx="${x}" cy="${y}" r="${2*u}" fill="var(--warn)"/></g>`}
  $("ov").innerHTML=h}
function zoomAt(f,cx,cy){const [x,y,w,h]=S.vb;if(cx==null){cx=x+w/2;cy=y+h/2}const nw=w/f,nh=h/f;setVB([cx-(cx-x)/f,cy-(cy-y)/f,nw,nh])}
function bindMap(){const svg=$("svg");if(!svg)return;const pts=new Map();let st=null,moved=false;
  const toSvg=(cx,cy)=>{const r=svg.getBoundingClientRect();return [S.vb[0]+(cx-r.left)/r.width*S.vb[2],S.vb[1]+(cy-r.top)/r.height*S.vb[3]]};
  svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=false;st={vb:[...S.vb],p:[...pts.values()].map(p=>[...p])}});
  svg.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);const r=svg.getBoundingClientRect(),k=st.vb[2]/r.width;const P=[...pts.values()];
    if(P.length===1&&st.p.length===1){const dx=P[0][0]-st.p[0][0],dy=P[0][1]-st.p[0][1];if(Math.hypot(dx,dy)>6)moved=true;if(moved)setVB([st.vb[0]-dx*k,st.vb[1]-dy*k,st.vb[2],st.vb[3]])}
    else if(P.length>=2&&st.p.length>=2){moved=true;const d0=Math.hypot(st.p[0][0]-st.p[1][0],st.p[0][1]-st.p[1][1]),d1=Math.hypot(P[0][0]-P[1][0],P[0][1]-P[1][1]);const f=d1/(d0||1);
      const c0=[(st.p[0][0]+st.p[1][0])/2,(st.p[0][1]+st.p[1][1])/2],c1=[(P[0][0]+P[1][0])/2,(P[0][1]+P[1][1])/2];

  const end=e=>{const wasTap=!moved&&pts.size===1;pts.delete(e.pointerId);if(pts.size)st={vb:[...S.vb],p:[...pts.values()].map(p=>[...p])};
    if(wasTap&&e.type==="pointerup"){const pin=e.target.closest&&e.target.closest("[data-pin]");
      if(S.pick){const [x,y]=toSvg(e.clientX,e.clientY);S.pick.ll=unproj(x,y);redrawMap()}

}

/* ================= 画面：割り勘 ================= */
const yen=n=>(n<0?"-":"")+Math.abs(Math.round(n)).toLocaleString("ja-JP")+"円";
function mems(t){return Object.entries(t.members||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order||0)-(b.order||0))}
function mName(t,id){return t.members?.[id]?.name||"（外した人）"}
function settle(ms,list){const st={};ms.forEach(m=>st[m.id]={paid:0,owe:0});
  for(const e of list){const sp=(e.split||[]).filter(id=>st[id]);if(!sp.length||!st[e.payer]||!(e.amount>0))continue;const one=Math.floor(e.amount/sp.length);st[e.payer].paid+=e.amount;st[e.payer].owe+=e.amount-one*sp.length;sp.forEach(id=>st[id].owe+=one)}
  const net=Object.entries(st).map(([id,v])=>({id,net:v.paid-v.owe}));const cr=net.filter(x=>x.net>0).sort((a,b)=>b.net-a.net),db=net.filter(x=>x.net<0).map(x=>({...x,net:-x.net})).sort((a,b)=>b.net-a.net);
  const pays=[];let i=0,j=0;while(i<cr.length&&j<db.length){const a=Math.min(cr[i].net,db[j].net);if(a>0)pays.push({from:db[j].id,to:cr[i].id,amount:a});cr[i].net-=a;db[j].net-=a;if(!cr[i].net)i++;if(!db[j].net)j++}return {st,pays}}

    ${list.length?(pays.length?`<ul class="pays">${pays.map(p=>`<li><b>${esc(mName(t,p.from))}</b><span class="sub">→</span><b>${esc(mName(t,p.to))}</b><span class="amt">${yen(p.amount)}</span></li>`).join("")}</ul>`:`<p class="sub">精算は必要ありません</p>`)+`<div class="tbl"><table><thead><tr><th>名前</th><th class="r">払った</th><th class="r">負担</th><th class="r">差額</th></tr></thead><tbody>${ms.map(m=>{const v=st[m.id],n=v.paid-v.owe;return `<tr><td>${esc(m.name)}</td><td class="r">${yen(v.paid)}</td><td class="r">${yen(v.owe)}</td><td class="r ${n>0?"plus":n<0?"minus":""}">${n>0?"+":""}${yen(n)}</td></tr>`}).join("")}</tbody></table></div><p class="sub">割り切れない端数は払った人が負担しています。</p>`:`<p class="sub">立て替えを記録すると、だれが誰にいくら払えばいいかがここに出ます。</p>`}

    <form id="mForm" class="row"><input type="text" id="m_name" maxlength="20" placeholder="名前（例：やまだ）" aria-label="メンバーの名前" style="flex:1"><button class="btn" type="submit">追加</button></form>${ms.length<2?`<p class="sub">2人以上登録すると、立て替えを記録できます。</p>`:""}</section>

let SAMPLE=null;(async()=>{try{SAMPLE=await window.claude?.use?.("sample")}catch(e){}if(SAMPLE&&S.ai)draw()})();
const CATS={see:"観光",food:"ごはん",shop:"買い物",nature:"自然",activity:"体験",view:"景色",cafe:"カフェ"};
const PREFS=["定番の名所","ごはん・グルメ","映える景色","自然","歴史・文化","カフェ","買い物","体験・アクティビティ","温泉","のんびり"];
function aiDefaults(t){return {dest:t.title.replace(/\s*\d+泊\d+日.*$/,""),from:"名古屋",people:t.people||"",prefs:["定番の名所","ごはん・グルメ"],pace:"ふつう",move:"電車・バス",budget:"",extra:"",count:15,theme:"",mode:"replace"}}

}`;
  if(kind==="more")return `あなたは旅行プランナーです。「${o.dest}」の旅行で、行きたい場所の候補を${o.count}か所追加で出してください。
- 旅行の日程：${day}
- 人数：${o.people||"未定"}　移動手段：${o.move}
${o.theme?`- 今回のテーマ：${o.theme}\n`:""}- 好み：${o.prefs.join("、")||"特になし"}
- すでに候補にある場所（これとは重ならないように）：${have.join("、")||"なし"}

- "days" は空の配列 [] にする

function pickJSON(s){s=String(s||"");const m=/```(?:json)?\s*([\s\S]*?)```/.exec(s);if(m)s=m[1];const a=s.indexOf("{"),b=s.lastIndexOf("}");if(a<0||b<a)throw new Error("nojson");return JSON.parse(s.slice(a,b+1))}
const normName=s=>String(s||"").replace(/[\s　・（）()「」]/g,"").toLowerCase();
const okTime=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||"").trim());return m&&+m[1]<24&&+m[2]<60?pad(+m[1])+":"+m[2]:""};
const str=(v,n)=>typeof v==="string"?v.trim().slice(0,n):"";
/* AIの返事を検査して、取り込める形にする */
function aiCheck(t,raw,kind){const ds=dates(t);const warn=[];const out={spots:[],days:{},areas:{}};
  const exist=new Map(spots(t).map(s=>[normName(s.name),s.id]));const seen=new Set();
  (Array.isArray(raw.spots)?raw.spots:[]).slice(0,60).forEach(r=>{const name=str(r&&r.name,60);if(!name)return;const k=normName(name);if(seen.has(k))return;seen.add(k);
    let lat=+r.lat,lon=+r.lon;if(!(isFinite(lat)&&isFinite(lon))||Math.abs(lat)>90||Math.abs(lon)>180||(lat===0&&lon===0)){lat=null;lon=null}
    out.spots.push({name,dup:exist.has(k),area:str(r.area,30),cat:CATS[r.category]?r.category:"see",note:str(r.note,300),fee:str(r.fee,40),lat,lon,book:!!r.booking,minutes:+r.minutes>0?Math.min(600,Math.round(+r.minutes)):null,rain:!!r.rain_ok})});
  if(kind!=="more")(Array.isArray(raw.days)?raw.days:[]).forEach(d=>{const date=str(d&&d.date,10);if(!ds.includes(date)){if(date)warn.push(`${date} は旅行の日にちの外なので入れません`);return}
    out.areas[date]=str(d.area,30);out.days[date]=(Array.isArray(d.items)?d.items:[]).slice(0,30).map(x=>({time:okTime(x&&x.time),arrive:okTime(x&&x.arrive),kind:KINDS[x&&x.kind]?x.kind:"other",title:str(x&&x.title,60),note:str(x&&x.note,140),spotName:str(x&&x.spot,60)})).filter(x=>x.title)});
  const nItems=Object.values(out.days).reduce((s,a)=>s+a.length,0);
  const noPos=out.spots.filter(s=>s.lat==null).length;if(noPos)warn.push(`位置（緯度・経度）がない場所が${noPos}か所あります。取り込んだあと地図で置けます`);
  const dup=out.spots.filter(s=>s.dup).length;if(dup)warn.push(`すでにある場所と同じ名前が${dup}か所あるので、それは追加しません`);
  /* 時間のかぶりを、取り込んだ後と同じ規則で確かめる */
  const tmp={...t,items:{}};Object.entries(out.days).forEach(([date,its])=>its.forEach((x,i)=>tmp.items["c"+date+i]={...x,date,order:i+1}));
  let clash=0;Object.entries(out.days).forEach(([date,its])=>its.forEach((x,i)=>{if(x.kind!=="move"&&conflict(tmp,date,x.time,"c"+date+i)){x.flag=true;clash++}}));
  if(clash)warn.push(`移動中・到着前などに入っている予定が${clash}件あります（取り込むと「要確認」が付きます）`);
  if(!out.spots.length&&!nItems)throw new Error("empty");
  return {...out,nItems,warn}}
function aiApply(c,mode){return change(`AIの${c.nItems?"プラン":"候補"}を取り込みました`,t=>{t.spots=t.spots||{};t.items=t.items||{};t.dayInfo=t.dayInfo||{};

  c.spots.forEach((s,i)=>{if(s.dup)return;const id=uid()+i;t.spots[id]={name:s.name,area:s.area,cat:s.cat,note:s.note+(s.rain?"（雨の日もOK）":""),fee:s.fee,url:"",lat:s.lat,lon:s.lon,book:s.book,minutes:s.minutes,ai:true,created:Date.now()+i};ids.set(normName(s.name),id)});

/* ================= 旅行を渡す・バックアップ =================
   旅行のデータを圧縮して「コード」（TABI1:…）にする。LINEなどで送り、相手は貼るだけで取り込める */
const b64u=u8=>{let s="";for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function packCode(kind,obj){const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{const cs=new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));return `TABI${kind}1:`+b64u(new Uint8Array(await new Response(cs).arrayBuffer()))}catch(e){}}
  return `TABI${kind}0:`+b64u(raw)}
async function unpackCode(text){const m=/TABI(ALL)?([01]):([A-Za-z0-9_-]{8,})/.exec(String(text||"").replace(/\s+/g,""));if(!m)throw new Error("nocode");
  let u8=unb64u(m[3]);if(m[2]==="1"){if(!window.DecompressionStream)throw new Error("old");u8=new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer())}
  return {all:!!m[1],data:JSON.parse(new TextDecoder().decode(u8))}}
/* 受け取ったデータは決まった形だけ通す（変な値やHTMLを入れさせない） */
const cs_=(v,n)=>typeof v==="string"?v.slice(0,n):"";
const cd_=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v)?v:"";
const ct_=v=>{const m=typeof v==="string"&&/^(\d{2}):(\d{2})$/.exec(v);return m&&+m[1]<24&&+m[2]<60?v:""};
const cn_=(v,lo,hi)=>{const x=+v;return isFinite(x)&&x>=lo&&x<=hi?x:null};
const cid_=k=>/^[A-Za-z0-9_-]{1,60}$/.test(k);
function cleanMap(o,fn){const r={};if(o&&typeof o==="object")Object.entries(o).slice(0,500).forEach(([k,v])=>{if(cid_(k)&&v&&typeof v==="object"){const x=fn(v);if(x)r[k]=x}});return r}
function cleanTrip(o){if(!o||typeof o!=="object")return null;const start=cd_(o.start),end=cd_(o.end);if(!start||!end||end<start)return null;
  const t={title:cs_(o.title,40)||"旅行",start,end,people:cn_(o.people,1,50)??"",created:cn_(o.created,0,1e14)||Date.now(),sid:cid_(o.sid||"")?o.sid:uid(),
    items:cleanMap(o.items,v=>{const date=cd_(v.date);if(!date)return null;return {date,time:ct_(v.time),arrive:ct_(v.arrive),kind:KINDS[v.kind]?v.kind:"other",title:cs_(v.title,60)||"予定",note:cs_(v.note,160),spot:cid_(v.spot||"")?v.spot:"",order:cn_(v.order,-1e6,1e6)||0}}),
    spots:cleanMap(o.spots,v=>{const name=cs_(v.name,60);if(!name)return null;const lat=cn_(v.lat,-90,90),lon=cn_(v.lon,-180,180);return {name,area:cs_(v.area,30),cat:CATS[v.cat]?v.cat:"",note:cs_(v.note,500),fee:cs_(v.fee,40),url:/^https?:\/\//.test(v.url||"")?cs_(v.url,500):"",lat:lat!=null&&lon!=null?lat:null,lon:lat!=null&&lon!=null?lon:null,book:!!v.book,minutes:cn_(v.minutes,1,600),created:cn_(v.created,0,1e14)||0}}),
    members:cleanMap(o.members,v=>{const name=cs_(v.name,20);return name?{name,order:cn_(v.order,0,1e6)||0}:null}),
    expenses:cleanMap(o.expenses,v=>{const amount=cn_(v.amount,1,1e9);if(!amount)return null;return {title:cs_(v.title,60)||"記録",amount:Math.round(amount),payer:cid_(v.payer||"")?v.payer:"",split:Array.isArray(v.split)?v.split.filter(x=>cid_(String(x))).slice(0,50):[],date:cd_(v.date),created:cn_(v.created,0,1e14)||0}}),
    checks:cleanMap(o.checks,v=>{const title=cs_(v.title,60);return title?{title,group:cs_(v.group,20),done:!!v.done,order:cn_(v.order,0,1e6)||0}:null}),
    dayInfo:cleanMap(o.dayInfo,v=>({area:cs_(v.area,30)})),
    notif:o.notif&&typeof o.notif==="object"?{before:cn_(o.notif.before,0,1440)??NDEF.before,eve:{on:!!o.notif.eve?.on,time:ct_(o.notif.eve?.time)||"20:00"},morn:{on:!!o.notif.morn?.on,time:ct_(o.notif.morn?.time)||"07:00"},pre:{on:!!o.notif.pre?.on,days:cn_(o.notif.pre?.days,1,60)||7}}:{...NDEF}};
  if(dates(t).length>31)return null;return t}
async function shareTrip(t){if(!t.sid){change("",x=>{x.sid=uid()},true)}const code=await packCode("",{...T(),v:1});
  const msg=`旅のノートの旅行「${t.title}」です。\nアプリの「受け取った旅行を取り込む」に、このメッセージをまるごと貼ってください。\n\n${code}`;

async function backupAll(){const code=await packCode("ALL",{v:1,trips:DB.trips});const msg=`旅のノートのバックアップ（旅行${Object.keys(DB.trips).length}件・${new Date().toLocaleDateString("ja-JP")}）\n「受け取った旅行を取り込む」に貼ると戻せます。\n\n${code}`;

function importView(){const I=S.imp;
  if(I.list)return `<section class="card form"><h2 style="font-size:20px">取り込む旅行の確認</h2>

const CHECK_TPL=[["貴重品",["財布","スマホ","充電器・モバイルバッテリー","身分証（学生証など）","保険証のコピー"]],["服",["着替え","上着","歩きやすい靴","寝間着"]],["日用品",["歯ブラシ","常備薬","折りたたみ傘","タオル"]],["予約",["宿の予約を確認","行きの交通の予約を確認","帰りの交通の予約を確認"]]];
function checks(t){return Object.entries(t.checks||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order||0)-(b.order||0))}
function prepView(t){const cs=checks(t),done=cs.filter(c=>c.done).length;const groups=[...new Set(cs.map(c=>c.group||"そのほか"))];
  const hide=!!S.hideDone;
  return `<section class="card form"><div class="row" style="justify-content:space-between"><h3 style="font-size:17px">持ち物・やること</h3>${cs.length?`<label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="c_hide" ${hide?"checked":""}>済みを隠す</label>`:""}</div>
   ${cs.length?`<div class="row" style="gap:10px"><div style="flex:1;height:8px;border-radius:6px;background:var(--line);overflow:hidden"><i style="display:block;height:100%;width:${done/cs.length*100}%;background:var(--ok)"></i></div><b class="num">${done} / ${cs.length}</b></div>
   ${groups.map(g=>{const its=cs.filter(c=>(c.group||"そのほか")===g&&!(hide&&c.done));if(!its.length)return"";return `<div><span class="lbl">${esc(g)}</span><ul class="nlist">${its.map(c=>`<li style="grid-template-columns:auto minmax(0,1fr) auto;align-items:center"><input type="checkbox" data-check="${c.id}" ${c.done?"checked":""} aria-label="${esc(c.title)}" style="width:20px;height:20px"><span style="${c.done?"text-decoration:line-through;color:var(--muted)":""}">${esc(c.title)}</span><button class="ib" data-a="delCheck" data-id="${c.id}" aria-label="${esc(c.title)}を消す">消す</button></li>`).join("")}</ul></div>`}).join("")}`
   :`<div class="empty" style="padding:18px"><span>旅行の前に確認したい持ち物や、やっておくことをリストにできます。</span><button class="btn fill" data-a="checkTpl">よく使う項目を入れる</button></div>`}
   <form id="cForm" class="row"><input type="text" id="c_title" maxlength="60" placeholder="追加する項目（例：カメラ）" aria-label="追加する項目" style="flex:1 1 160px"><select id="c_group" aria-label="グループ" style="width:auto">${[...new Set([...groups,...CHECK_TPL.map(x=>x[0]),"そのほか"])].map(g=>`<option>${esc(g)}</option>`).join("")}</select><button class="btn" type="submit">追加</button></form></section>
  <h3 style="font-size:17px;margin-top:6px">通知</h3>${notifView(t)}`}

function draw(){const t=T();
  if(!t){S.tid=null;$("bar").innerHTML=`<div class="ttl"><b>旅のノート</b><small>旅行をつくって、日程・場所・地図・割り勘・通知をまとめる</small></div>`;$("tabbar").hidden=true;$("app").innerHTML=`<div class="page">${tripsView()}</div>`;return}
  if(S.tripForm){$("bar").innerHTML=`<button class="back" data-a="cancel">‹ 戻る</button><div class="ttl"><b>${esc(t.title)}</b></div>`;$("tabbar").hidden=true;$("app").innerHTML=`<div class="page">${tripForm()}</div>`;return}
  const ds=dates(t);
  $("bar").innerHTML=`<button class="back" data-a="home">‹ 旅行</button><div class="ttl"><b>${esc(t.title)}</b><small>${md(ds[0])}（${wd(ds[0])}）〜${md(ds[ds.length-1])}（${wd(ds[ds.length-1])}） ・ ${countdown(t)}</small></div><nav class="toptabs">${TABS.map(([k,l])=>`<button data-a="tab" data-t="${k}" aria-current="${S.tab===k?"page":"false"}">${l}</button>`).join("")}</nav><button class="ib" data-a="editTrip">設定</button>`;
  $("tabbar").hidden=false;$("tabs").innerHTML=TABS.map(([k,l,ic])=>`<button data-a="tab" data-t="${k}" aria-current="${S.tab===k?"page":"false"}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ic}"/></svg>${l}</button>`).join("");
  const v=S.ai?aiView(t):S.tab==="plan"?planView(t):S.tab==="spots"?spotsView(t):S.tab==="map"?mapView(t):S.tab==="split"?splitView(t):prepView(t);
  $("app").innerHTML=`<div class="page">${v}</div>`;
  if(S.tab==="map"&&!S.ai){bindMap();setVB(S.vb||fitVB(t))}
  saveUI();
}

document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;const t=T();
  switch(a){
   case"undo":$("toast").hidden=true;undo();break;
   case"about":S.about=true;S.confirm=null;draw();window.scrollTo(0,0);break;
   case"aboutClose":S.about=false;S.confirm=null;draw();break;
   case"wipe":S.confirm="wipe";draw();break;
   case"wipeYes":{try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+"-ui")}catch(e){}DB={trips:{}};UNDO=null;S.confirm=null;S.about=false;S.tid=null;
     const LN=Native.plug("LocalNotifications");if(Native.isApp&&LN){try{const p=await LN.getPending();if(p.notifications.length)await LN.cancel({notifications:p.notifications.map(n=>({id:n.id}))})}catch(e){}}
     toast("すべてのデータを消しました");draw();break}
   case"checkTpl":if(change("よく使う項目を入れました",t=>{t.checks=t.checks||{};let o=0;CHECK_TPL.forEach(([g,its])=>its.forEach(x=>{t.checks[uid()+(o++)]={title:x,group:g,done:false,order:o}}))}))draw();break;
   case"delCheck":if(change("項目を消しました",t=>{delete t.checks[id]}))draw();break;
   case"shareTrip":await shareTrip(t);break;
   case"backup":await backupAll();break;
   case"codeCopy":{try{await navigator.clipboard.writeText(S.codeOut);toast("コピーしました")}catch(e){$("codebox").select();toast("選択しました。コピーしてください")}break}
   case"codeClose":S.codeOut=null;draw();break;
   case"impOpen":S.imp={text:""};S.codeOut=null;draw();window.scrollTo(0,0);break;
   case"impCancel":S.imp=null;draw();break;
   case"impRead":{const text=$("imp_text").value;S.imp.text=text;try{const r=await unpackCode(text);const raw=r.all?Object.values(r.data.trips||{}):[r.data];const list=raw.map(cleanTrip).filter(Boolean);if(!list.length)throw new Error("empty");S.imp.list=list;draw()}
     catch(e){toast(e.message==="old"?"この端末では読めない形式です。アプリを最新にしてください":e.message==="nocode"?"コードが見つかりませんでした。TABI1: から始まる部分を含めて貼ってください":"読み取れませんでした。メッセージをまるごと貼り直してください")}break}
   case"impOk":{const I=S.imp;const backup=JSON.stringify(DB.trips);let n=0;I.list.forEach((x,i)=>{const r=document.querySelector(`[name=imp_${i}]:checked`);const same=Object.entries(DB.trips).find(([k,v])=>v.sid&&v.sid===x.sid);
       if(same&&(!r||r.value==="replace")){DB.trips[same[0]]=x}else{if(same)x.sid=uid();DB.trips[uid()+i]=x}n++});
     if(!save()){DB.trips=JSON.parse(backup);toast("この端末に保存できませんでした");break}S.imp=null;UNDO=null;toast(`${n}件の旅行を取り込みました`);draw();break}
   case"aiOpen":S.ai={kind:b.dataset.k,step:"form",o:aiDefaults(t)};S.edit=null;draw();window.scrollTo(0,0);break;
   case"aiClose":S.ai=null;draw();break;
   case"aiBack":S.ai.step="form";draw();break;
   case"aiCopy":{aiReadForm();const p=aiPrompt(t,S.ai.o,S.ai.kind);try{await navigator.clipboard.writeText(p);toast("指示文をコピーしました。AIのチャットに貼ってください")}catch(e){S.ai.paste="";const ta=$("ai_paste");ta.value=p;ta.select();toast("指示文を下の欄に出しました。コピーしてから、AIの答えに貼り替えてください")}break}
   case"aiRead":aiReadForm();aiParse(S.ai.paste);break;
   case"aiApply":{aiReadForm();const c=S.ai.c,k=S.ai.kind;if(aiApply(c,S.ai.o.mode)){S.ai=null;S.tab=k==="more"?"spots":"plan";draw();window.scrollTo(0,0)}break}
   case"aiClaude":{if(!SAMPLE||S.ai.busy)break;aiReadForm();const A=S.ai;A.busy=true;A.live="";draw();
     try{const r=await SAMPLE(aiPrompt(t,A.o,A.kind),{modelTier:"complex",onText:({text})=>{A.live=`${text.length}文字…`;const el=$("ai_live");if(el)el.textContent=A.live}});A.busy=false;if(S.ai!==A)break;aiParse(r.text)}
     catch(e){A.busy=false;draw();toast(e&&e.code==="not_granted"?"Claudeを使う許可がありません。ほかのAIで作る方法を使ってください":e&&e.code==="rate_limited"?"混み合っています。少し待ってからもう一度":"Claudeで作れませんでした。ほかのAIで作る方法も使えます")}break}

     const r=await Native.share(t.title,txt);if(r==="copied")toast("精算をコピーしました。LINEなどに貼れます");else if(!r){S.tab="plan";S.copy=txt;draw()}break}
   case"askPerm":{S.perm=await Native.perm(true);if(S.perm==="granted"){schedNotif();toast("通知をオンにしました")}draw();break}
   case"testNotif":{const f=notifList(t).find(x=>x.at>new Date())||{title:`${t.title}`,body:"通知はこのように届きます"};const r=await Native.testNotify(f);if(r==="app")toast("5秒後に通知が届きます");else if(r==="web")showBanner(f);else{S.perm=await Native.perm(false);draw();toast("通知が許可されていません。iPhoneの設定から許可してください")}break}
  }});
document.addEventListener("change",e=>{const t=T();if(!t)return;
  if(e.target.dataset&&e.target.dataset.check){const id=e.target.dataset.check,v=e.target.checked;if(change(v?"チェックしました":"チェックを外しました",t=>{t.checks[id].done=v},true))draw();return}
  if(e.target.id==="c_hide"){S.hideDone=e.target.checked;draw();return}
  if(e.target.closest("#itemForm"))itemWarn();
  if(/^as_t_/.test(e.target.id)){S.atime=readTime("as_t");const s=t.spots[S.assign];if(s&&$("as_days"))$("as_days").innerHTML=asDays(t,{id:S.assign,...s})}
  if(e.target.id==="sf_ll"){const ll=parseLL(e.target.value);if(ll){$("sf_lat").value=ll.lat;$("sf_lon").value=ll.lon;$("sf_pos").innerHTML=`<span class="tag">設定済み（${ll.lat.toFixed(4)}, ${ll.lon.toFixed(4)}）</span>`;if(ll.lat<20||ll.lat>46||ll.lon<122||ll.lon>154)toast("日本の外の場所は、いまは地図に表示されません")}else if(e.target.value.trim())toast("位置を読み取れませんでした。「35.71, 139.81」の形か、@の入ったリンクを貼ってください")}
  if(/^n_/.test(e.target.id)){const n=nset(t);const v=id=>$(id)?.value;
    const nn={before:+(v("n_before")??n.before),eve:{on:$("n_eve_on").checked,time:$("n_eve_h")?pad(v("n_eve_h"))+":"+v("n_eve_m"):n.eve.time},morn:{on:$("n_morn_on").checked,time:$("n_morn_h")?pad(v("n_morn_h"))+":"+v("n_morn_m"):n.morn.time},pre:{on:$("n_pre_on").checked,days:$("n_pre_days")?+v("n_pre_days"):n.pre.days}};
    if(change("通知の設定を変えました",t=>{t.notif=nn},true)){draw();const on=nn.before>0||nn.eve.on||nn.morn.on||nn.pre.on;
      if(on&&Native.isApp&&S.perm!=="granted")Native.perm(true).then(p=>{S.perm=p;if(p==="granted")schedNotif();draw()})}}
});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;const t=T();
  if(f.id==="tripForm"){const title=$("tf_title").value.trim(),start=$("tf_start").value,end=$("tf_end").value,people=$("tf_people").value;
    if(!title||!start||!end){toast("名前と日にちを入れてください");return}if(end<start){toast("帰る日は出発日より後にしてください");return}
    if((toD(end)-toD(start))/864e5>30){toast("31日以内の旅行にしてください");return}
    if(S.tripForm==="edit"){const ds=dates({start,end});const out=Object.values(t.items||{}).filter(x=>!ds.includes(x.date)).length;
      if(change("旅行の設定を保存しました",t=>{Object.assign(t,{title,start,end,people})})){S.tripForm=null;if(out)toast(`日付の外になった予定が${out}件あります（消してはいません）`);draw()}}
    else{const id=uid();DB.trips[id]={title,start,end,people,created:Date.now(),sid:uid(),items:{},spots:{},members:{},expenses:{},notif:{...NDEF}};
      if(!save()){delete DB.trips[id];toast("この端末に保存できませんでした");return}S.tripForm=null;S.tid=id;S.tab="plan";UNDO=null;toast("旅行を作りました");draw()}
    return}
  if(!t)return;
  if(f.id==="itemForm"){const date=$("f_date").value,id=f.dataset.id||null;const kind=$("f_kind").value,spot=$("f_spot")?.value||"";let title=$("f_title").value.trim();if(!title&&spot)title=t.spots[spot].name;if(!title){toast("内容を入力してください");return}
    const time=readTime("f_t");if(kind!=="move"){const w=conflict(t,date,time,id);if(w){toast(w);return}}
    const old=id?t.items[id]:null;const moved=old&&old.date!==date;
    if(change(moved?`予定を${dates(t).indexOf(date)+1}日目に移しました`:old?"予定を保存しました":"予定を追加しました",t=>{t.items=t.items||{};t.items[id||uid()]={date,time,arrive:kind==="move"?readTime("f_a"):"",kind,title,note:$("f_note").value.trim(),spot,order:old&&!moved?old.order:nextOrder(t,date)}})){S.edit=null;draw()}return}
  if(f.id==="spotForm"){const id=f.dataset.id||null;const v=readSpotForm();const ll=parseLL($("sf_ll").value);if(ll){v.lat=ll.lat;v.lon=ll.lon}
    if(!v.name){toast("名前を入れてください");return}if(v.url&&!/^https?:\/\//.test(v.url)){toast("リンクは https:// から始まるものにしてください");return}
    const old=id?t.spots[id]:null;
    if(change(old?"場所を保存しました":"場所を追加しました",t=>{t.spots=t.spots||{};t.spots[id||uid()]={...v,created:old?.created||Date.now()}})){S.edit=null;S.draft=null;draw()}return}
  if(f.id==="cForm"){const title=$("c_title").value.trim();if(!title)return;const g=$("c_group").value;const cs=checks(t);
    if(change("項目を追加しました",t=>{t.checks=t.checks||{};t.checks[uid()]={title,group:g,done:false,order:(cs.length?Math.max(...cs.map(c=>c.order||0)):0)+1}},true)){draw();$("c_title")?.focus()}return}
  if(f.id==="mForm"){const name=$("m_name").value.trim();if(!name)return;const ms=mems(t);if(ms.some(m=>m.name===name)){toast("同じ名前の人がいます");return}if(ms.length>=20){toast("メンバーは20人までです");return}
    if(change("メンバーを追加しました",t=>{t.members=t.members||{};t.members[uid()]={name,order:(ms.length?Math.max(...ms.map(m=>m.order||0)):0)+1}},true)){draw();$("m_name")?.focus()}return}
  if(f.id==="exForm"){const title=$("ex_title").value.trim();const amount=Math.round(+$("ex_amount").value.replace(/[,，円\s]/g,"").replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)));
    const split=[...f.querySelectorAll("[name=ex_split]:checked")].map(x=>x.value);
    if(!title){toast("内容を入力してください");return}if(!(amount>0)||amount>1e9){toast("金額を数字で入力してください");return}if(!split.length){toast("割る人を1人以上選んでください");return}
    const old=S.wform!=="new"?t.expenses[S.wform]:null;
    if(change(old?"記録を保存しました":"記録しました",t=>{t.expenses=t.expenses||{};t.expenses[old?S.wform:uid()]={title,amount,payer:$("ex_payer").value,split,date:$("ex_date").value,created:old?.created||Date.now()}})){S.wform=null;draw()}return}
});
window.addEventListener("resize",()=>{if(S.tab==="map"&&S.vb&&$("svg"))setVB(S.vb)});
/* 戻るボタン（Android・ブラウザ）で旅行一覧へ */
draw();schedNotif();
Native.perm(false).then(p=>{S.perm=p;if(S.tab==="notif")draw()});
</script>
</body></html>
