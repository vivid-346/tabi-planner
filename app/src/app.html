<title>旅のノート アプリ版</title>
<style>
/* スマホアプリ想定：下にタブバー、上に旅行名。外部のフォントや地図は使わず、すべて端末の中で動く（オフライン対応）。
   日にちの色：1日目=紅 2日目=藍 3日目=山吹 4日目=若竹 5日目=江戸紫 6日目=珊瑚 7日目=群青（以降くり返し） */
:root{color-scheme:light only;
  --ground:#EBF1F0; --paper:#FFFFFF; --ink:#13302E; --muted:#58706D; --line:#D3E0DD;
  --accent:#0E6C74; --accent-soft:#D8EBEB;
  --sea:#D3E6E8; --land:#F4EFE2; --land-line:#C9BE9F;
  --c1:#C2364A; --c2:#1F68AE; --c3:#B47905; --c4:#3C8A3A; --c5:#7A4FA3; --c6:#D0602F; --c7:#24508C;
  --warn:#B4322A; --warn-soft:#F7E2E0; --ok:#2C7A4B;
  --shadow:0 1px 2px rgba(19,48,46,.06),0 8px 22px rgba(19,48,46,.08);
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --display:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --tabh:62px;
}


*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* 上のバー */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:54px}
.bar .back{border:0;background:none;color:var(--accent);font-weight:700;padding:6px 4px;cursor:pointer;white-space:nowrap}
.bar .ttl{flex:1;min-width:0}
.bar .ttl b{display:block;font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl small{display:block;color:var(--muted);font-size:12px}
.toptabs{display:none}
/* 下のタブバー（スマホ） */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--paper) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto;height:var(--tabh)}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
@media (min-width:900px){.tabbar{display:none}.toptabs{display:flex;gap:2px}.toptabs button{border:0;background:none;padding:7px 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}.toptabs button[aria-current="page"]{background:var(--ink);color:var(--paper)}}

.page{max-width:980px;margin:0 auto;padding:18px 16px calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
@media (min-width:900px){.page{padding-bottom:56px}}
.sub{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;min-height:36px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.fill{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.fill:hover{color:var(--paper);filter:brightness(1.07)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger.fill{background:var(--warn);color:var(--paper)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{width:100%;padding:12px;font-size:15px}
.ib{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:8px;cursor:pointer}
.ib:hover{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.empty{background:var(--paper);border:1.5px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:16px}
.tag{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.cand{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* フォーム */
.form{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 11px;min-width:0;font-size:16px}
textarea{min-height:64px;resize:vertical}
.tsel{display:flex;gap:4px}.tsel select{width:auto}
.warn{margin:0;padding:7px 11px;border-radius:9px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:700}
.note{margin:0;padding:9px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13px}
.inbox{background:var(--ground);border-radius:12px;padding:12px}

/* 旅行の一覧 */
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.trip{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.trip .band{height:8px;background:var(--tc)}
.trip .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.trip h3{font-size:19px}
.trip .cd{font-family:var(--num);font-weight:800;color:var(--accent)}

/* 日程 */
.days{display:flex;flex-direction:column;gap:14px}
.day{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.day header{padding:12px 16px;border-left:5px solid var(--dc);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.day header .k{font-family:var(--num);font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--dc)}
.day header h3{font-size:17px}
.day ul{list-style:none;margin:0;padding:0 16px}
.day li{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:8px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.day li.full{display:block}
.day .t{font-family:var(--num);font-weight:800;color:var(--dc)}
.day .t small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.day .ti{font-weight:700;overflow-wrap:anywhere}
.day .mv .ti{font-weight:500;color:var(--muted)}
.day .no{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.day .kind{font-size:11px;color:var(--muted);font-weight:700;margin-right:4px}
.day .foot{padding:8px 16px 14px}
.day .acts{display:flex}
.day header .stat{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.day header .stat a{color:var(--accent,var(--ink));font-weight:700;text-decoration:none}
.day li.done .ti,.day li.done .no{opacity:.5}.day li.done .ti{text-decoration:line-through;text-decoration-thickness:1px}
.ib.ok{color:var(--dc);font-weight:800}
.gap{padding:4px 0 4px 62px;border-top:0!important;font-size:12px;color:var(--muted)}.gap b{color:var(--ink);font-weight:700}.gap .w{color:var(--warn);font-weight:700}
.nowcard{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--warn)}
.nowcard .l{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.nowcard .n{font-weight:800;font-size:17px}.nowcard .n small{font-weight:600;color:var(--muted);font-size:12.5px;margin-left:6px}
.shiftw{font-size:13px;gap:6px}
.pv{background:#fff;color:#111;padding:8px 4px;font-size:13px;line-height:1.6}.pv h1{font-size:22px;margin:0}.pv h2{font-size:15px;margin:18px 0 6px;padding-bottom:4px;border-bottom:1.5px solid #111}
.pv table{width:100%;border-collapse:collapse}.pv td{padding:5px 6px;border-bottom:1px solid #ddd;vertical-align:top}.pv td.tm{width:86px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}.pv .nt{color:#555;font-size:12px}
.pv .meta{color:#555;font-size:12px}
@media print{.bar,.tabbar,.noprint,#toast{display:none!important}body,.page{background:#fff!important;padding:0!important;margin:0!important}.pv{padding:0}.pv h2{break-after:avoid}.pv tr{break-inside:avoid}}

/* 場所 */
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.spot{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.spot h3{font-size:17px;overflow-wrap:anywhere}
.spot .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.spot p{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.sph{margin:-14px -16px 4px}.sph img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-radius:16px 16px 0 0;background:var(--line)}
.sph figcaption{font-size:11px;color:var(--muted);padding:4px 16px 0;overflow-wrap:anywhere;line-height:1.5}.sph figcaption a{color:inherit}
.aigo{display:flex;flex-wrap:wrap;gap:8px}
.mapbox.rich{background:#E9E6F2}
.mapbox.rich #mlmap{position:absolute;inset:0}
.mapbox .mapmode{position:absolute;left:10px;top:10px;z-index:3;border:0;border-radius:14px;background:var(--solid,#fff);color:var(--ink);box-shadow:var(--shadow);font-size:12px;font-weight:700;padding:0 12px;min-height:36px;cursor:pointer}
.mlload{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none}
#mapOv{position:absolute;left:0;right:0;top:0;z-index:4}
#mapOv:empty{display:none}
.mk{border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:4px}
.mk .dot{position:relative;width:40px;height:40px;border-radius:50%;border:3px solid var(--c);background:var(--c);overflow:hidden;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25);flex:none}
.mk .dot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mk .dot b{position:relative;color:#fff;font:800 13px var(--num);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.mk .dot img+b{position:absolute;right:-1px;bottom:-1px;width:17px;height:17px;border-radius:50%;background:var(--c);font-size:10px;display:grid;place-items:center;text-shadow:none}
.mk.cand .dot{border-style:dashed;background:#fff}.mk.cand .dot b{color:var(--muted);text-shadow:none}.mk.cand .dot img+b{background:#fff;color:var(--muted)}
.mk .nm{font:700 11.5px var(--sans);color:#1D1F24;background:rgba(255,255,255,.88);padding:1px 7px;border-radius:9px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.mk.dim{opacity:.25}.mk.on .dot{width:48px;height:48px;box-shadow:0 0 0 4px rgba(255,255,255,.9),0 4px 14px rgba(0,0,0,.35)}
.mkx{width:22px;height:22px;border-radius:50%;border:3px solid var(--warn);background:rgba(255,255,255,.6)}
.selph{width:calc(100% + 40px);margin:-20px -20px 8px;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r) var(--r) 0 0;display:block}
.maplibregl-ctrl-attrib{font-size:10px}
.nph{position:relative;aspect-ratio:16/10;background:var(--sea);overflow:hidden;border-radius:var(--r) var(--r) 0 0}
.nph .mm{position:absolute;inset:0;width:100%;height:100%;display:block}
.nph .nic{position:absolute;left:12px;top:12px;width:40px;height:40px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:var(--shadow)}
.nph .nic svg{width:20px;height:20px;fill:none;stroke:var(--accent-ink);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.nph figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 12px!important;background:color-mix(in srgb,var(--paper) 80%,transparent);font-size:11px}
.thumb .mm,.thumb.mmw{display:block;width:100%;height:100%}
span.thumb{overflow:hidden;background:var(--sea)}
span.thumb .mm{width:60px;height:60px}
.phbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.assign{display:flex;flex-direction:column;gap:8px;background:var(--ground);border-radius:12px;padding:10px 12px}
.assign .btn small{font-weight:500}

/* 地図 */
.mapbox{position:relative;background:var(--sea);border-radius:16px;overflow:hidden;border:1px solid var(--line);height:min(68vh,620px);touch-action:none}
.mapbox svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none;cursor:grab}
.mapbox.pick svg{cursor:crosshair}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:.8;stroke-linejoin:round}
.city{fill:var(--muted);font-weight:700;paint-order:stroke;stroke:var(--land);stroke-linejoin:round}
.route{fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.route.dim{opacity:.12}
.pin{cursor:pointer}
.pin circle{stroke:var(--paper)}
.pin.cand circle{fill:var(--paper);stroke:var(--muted)}
.pin text.n{fill:#fff;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none;font-family:var(--num)}
.pin.cand text.n{fill:var(--muted)}
.pin .lab{fill:var(--ink);font-weight:700;paint-order:stroke;stroke:var(--land);stroke-linejoin:round;pointer-events:none}
.pin.dim{opacity:.18}
.pin.on circle{stroke:var(--ink)}
.cross circle{fill:none;stroke:var(--warn)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:800;font-size:19px;cursor:pointer;box-shadow:var(--shadow)}
.attr{position:absolute;left:8px;bottom:6px;font-size:10px;color:var(--muted)}
.pickbar{position:absolute;left:10px;right:10px;top:10px;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;box-shadow:var(--shadow)}
.pickbar b{flex:1;min-width:160px}
.pickbar .btn{min-height:32px;padding:5px 12px}
.selcard{display:flex;flex-direction:column;gap:6px}

/* 割り勘 */
.total{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:baseline}
.total b{font-family:var(--num);font-weight:800;font-size:28px}
.pays{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pays li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.pays .amt{margin-left:auto;font-family:var(--num);font-weight:800;font-size:18px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);border-radius:999px;padding:4px 4px 4px 12px;font-weight:700;font-size:14px}
.mchip.fixed{padding-right:12px}
.mchip button{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:50%;cursor:pointer}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px}
.checks input{width:18px;height:18px}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.ex .a{font-family:var(--num);font-weight:800}
.ex .s{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.ex .x{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:12px;color:var(--muted)}.tbl .r{text-align:right;font-family:var(--num)}
.plus{color:var(--ok);font-weight:700}.minus{color:var(--warn);font-weight:700}

/* 通知 */
.nset{display:flex;flex-direction:column;gap:0}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
.nrow b{font-size:15px}
.nrow small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.nrow .ctl{display:flex;gap:6px;align-items:center}
.nrow select{width:auto}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.nlist{list-style:none;margin:0;padding:0}
.nlist li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.nlist li:first-child{border-top:0}
.nlist .when{font-family:var(--num);font-weight:800;color:var(--accent);font-size:13px}
.nlist .when small{display:block;color:var(--muted);font-weight:600}
.nlist .past{opacity:.45}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px;font-size:13.5px;z-index:40;max-width:calc(100vw - 32px);display:flex;gap:10px;align-items:center}
@media (min-width:900px){.toast{bottom:24px}}
.toast button{border:0;background:var(--accent);color:var(--paper);border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer;white-space:nowrap}
.banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:50;background:var(--paper);color:var(--ink);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 14px;width:min(380px,calc(100vw - 24px));display:flex;gap:12px;align-items:flex-start}
.banner .ic{width:36px;height:36px;border-radius:9px;background:var(--accent);flex:none;display:grid;place-items:center;color:var(--paper);font-weight:800}
.banner small{display:block;color:var(--muted);font-size:11.5px}

/* ===== 案10（A改・コーラル）：余白を広く、飾りを減らし、文字の強弱をはっきり ===== */
:root{--ground:#F6F5F2;--paper:#FFFFFF;--ink:#1D1F24;--ink2:#3F434B;--muted:#6B6F76;--line:#E7E4DF;--soft:#EFEDE9;
 --accent:#D2452F;--accent-ink:#B83A26;--accent-soft:#FCEBE7;--on-accent:#FFFFFF;
 --c1:#D2452F;--c2:#2563A8;--c3:#B07A0A;--c4:#1F7A5A;--c5:#7A4FA3;--c6:#C2410C;--c7:#0E7490;
 --warn:#B42318;--warn-soft:#FDECEA;--ok:#1F7A5A;--sea:#DCEBF1;--land:#F7F4EE;--land-line:#D6CDBA;
 --shadow:0 4px 12px rgba(20,20,30,.05);--r:20px;
 --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Zen Kaku Gothic New","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
 --display:var(--sans);--num:"Figtree","Hiragino Sans",system-ui,sans-serif}


body{font-size:16px;line-height:1.7;letter-spacing:.01em;font-feature-settings:"palt" 1}
h1,h2,h3{font-weight:800;letter-spacing:.01em}
.num{font-family:var(--num);font-weight:700}
/* 上のバー */
.bar{background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border-bottom:0}
.bar .in{min-height:56px;padding:8px 16px}
.bar .back{color:var(--accent-ink);min-height:44px}
.bar .ttl b{font-size:17px;font-weight:800}
.bar .ttl small{font-size:12px}
.bar .ib{min-height:44px}
/* 下のタブ（浮かぶ白い帯） */
.tabbar{left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);border:0;border-radius:32px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:0 8px 24px rgba(20,20,30,.1);padding-bottom:0}
.tabbar .in{height:64px;padding:0 6px}
.tabbar button{font-weight:500;font-size:11px;color:var(--muted);min-height:52px}
.tabbar svg{width:23px;height:23px;stroke-width:1.75}
.tabbar button[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.page{padding:16px 16px calc(64px + 48px + env(safe-area-inset-bottom,0px));gap:24px}
.toast{bottom:calc(64px + 24px + env(safe-area-inset-bottom,0px));border-radius:16px;background:#26282E;color:#fff}
/* ボタン：枠線なし。主役はコーラル、ほかは薄いグレー */
.btn{border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:10px 16px;min-height:44px;font-size:14px;font-weight:700}
.btn:hover{color:var(--ink);filter:brightness(.97)}
.btn.fill{background:var(--accent);color:var(--on-accent)}
.btn.fill:hover{color:var(--on-accent)}
.btn.danger{background:var(--warn-soft);color:var(--warn)}
.btn.danger.fill{background:var(--warn);color:#fff}
.btn.big{min-height:52px;font-size:16px;border-radius:26px}
.ib{min-height:36px;padding:6px 10px;border-radius:12px;font-weight:500;color:var(--muted)}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib.icon{display:inline-grid;place-items:center;width:40px;height:40px;padding:0}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.card,.empty,.day,.spot,.trip,.nowcard{border-radius:var(--r);box-shadow:var(--shadow)}
.card{padding:20px}
.empty{border:0;background:var(--paper);padding:32px 24px}
.tag{border-radius:11px;padding:2px 9px;font-size:11px;background:var(--soft);color:var(--ink2)}
.tag.cand{border:0;background:var(--soft);color:var(--muted)}
.chip{border:0;background:var(--paper);box-shadow:var(--shadow);min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid transparent;background:var(--soft);border-radius:12px;padding:11px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--paper);outline:0}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:12px}
.inbox{background:var(--soft);border-radius:16px;padding:16px}
.sw input:checked+span{background:var(--accent)}
/* 旅行の一覧：写真のカード */
.trips{gap:16px}
.trip .cover{aspect-ratio:16/9;background:var(--soft) center/cover no-repeat;position:relative}
.trip .cover .cd2{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.42);color:#fff;border-radius:14px;padding:3px 11px;font-size:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.trip .cover .cd2 b{font-family:var(--num);font-weight:700;font-size:14px}
.trip .in{padding:16px 20px 20px;gap:4px}
.trip h3{font-size:20px}
.trip .band{display:none}
/* 日程：表紙 */
.hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:220px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;background:var(--accent) center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.6))}
.hero>*{position:relative}
.hero .badge{align-self:flex-start;display:inline-flex;align-items:baseline;gap:4px;padding:3px 12px;border-radius:14px;background:rgba(0,0,0,.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12.5px}
.hero .badge b{font-family:var(--num);font-weight:700;font-size:15px}
.hero h2{font-size:32px;line-height:1.2;margin-top:10px;font-weight:900}
.hero .m{font-size:13.5px;opacity:.92;margin-top:4px}
.hero .cr{position:absolute;right:12px;top:10px;font-size:11px;opacity:.75}
.hero.nophoto::before{background:none}
.dayjump{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--soft);overflow-x:auto;scrollbar-width:none}
.dayjump button{flex:1 0 auto;min-height:44px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:13px;font-weight:500;padding:0 12px;cursor:pointer;white-space:nowrap}
.dayjump button b{font-family:var(--num);font-weight:700;font-size:17px;color:var(--ink2);margin-right:4px}
.dayjump button:first-child{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
/* 日程：その日 */
.days{gap:40px}
.day{background:none;box-shadow:none;overflow:visible;scroll-margin-top:72px}
.day header{border-left:0;padding:0 4px 16px;display:block}
.day header .k{display:block;font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--dc)}
.day header h3{font-size:24px;font-weight:900;margin-top:2px}
.day header .sub{display:block;font-size:14px;margin-top:4px}
.day header .stat{margin-top:8px;font-size:12.5px}
.day header .stat a{color:var(--accent-ink)}
.day ul{padding:0;display:flex;flex-direction:column;gap:12px}
.day li{background:var(--paper);border:0;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 12px 16px 20px;grid-template-columns:52px minmax(0,1fr) auto;gap:0 14px;align-items:center}
.day li.mv{background:transparent;box-shadow:none;padding:2px 12px 2px 20px}
.day li.mv .ti{font-size:14px;color:var(--ink2);font-weight:500}
.day li.full{background:none;box-shadow:none;padding:0}
.day li.full:has(form){background:var(--paper);box-shadow:var(--shadow);padding:16px}
.day li.full:has(form) .inbox{background:none;padding:0}
.day .t{font-family:var(--num);font-weight:700;font-size:15px;color:var(--ink2);align-self:start;padding-top:2px}
.day li.mv .t{color:var(--muted)}
.day .t small{font-family:var(--num);font-weight:500;font-size:12px;color:var(--muted)}
.day .kind{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--ink2);margin:0 0 4px}
.day .k-see .kind{background:#E8F0FA;color:#2563A8}.day .k-food .kind{background:var(--accent-soft);color:var(--accent-ink)}.day .k-stay .kind{background:#EEE8F7;color:#6B45A0}

.day .ti{display:block;font-size:17px;font-weight:700;line-height:1.45}
.day .no{font-size:13px;margin-top:2px}
.day .acts{flex-direction:column;align-items:flex-end;gap:2px}
.day .acts .row1{display:flex;align-items:center;gap:4px}
.day .thumb{width:60px;height:60px;border-radius:14px;object-fit:cover;display:block;background:var(--soft)}
.day .foot{padding:16px 0 0}
.day .foot .btn{width:100%;background:var(--paper);box-shadow:var(--shadow);color:var(--accent-ink);min-height:52px;border-radius:26px}
.gap{padding:0 12px 0 86px;font-size:12px}
.nowcard{border-left:0;padding:20px;background:var(--paper)}
.nowcard .l{color:var(--accent-ink);letter-spacing:.06em}
/* 場所 */
.spots{gap:16px}
.spot{padding:20px;gap:8px}
.sph{margin:-20px -20px 4px}.sph img{border-radius:var(--r) var(--r) 0 0}
.sph figcaption{padding:6px 20px 0}
.spot h3{font-size:19px}
.spot p{font-size:14px;color:var(--ink2);line-height:1.75}
.spot .meta{font-size:12.5px}
.assign{background:var(--soft);border-radius:16px;padding:14px}
/* 地図・割り勘・準備 */
.mapbox{border:0;border-radius:var(--r);box-shadow:var(--shadow)}
.zoom button{border:0;border-radius:14px;width:44px;height:44px}
.pickbar{border-radius:16px;background:#26282E;color:#fff}
.pays li{background:var(--soft);border-radius:14px;padding:12px 14px}
.mchip{background:var(--soft)}
.total b{font-size:32px}
.nlist .when{color:var(--accent-ink)}
.banner .ic{background:var(--accent)}
.toast button{background:var(--accent);color:var(--on-accent);border-radius:10px}

/* ===== 案10 D改：パステル × すりガラス ===== */
:root{--ground:#F4F2FB;--paper:rgba(255,255,255,.72);--solid:#FFFFFF;--ink:#1F1D2B;--ink2:#423F55;--muted:#66637A;--line:rgba(90,63,208,.12);--soft:rgba(90,63,208,.07);
 --accent:#5A3FD0;--accent-ink:#5A3FD0;--accent-soft:#ECE8FF;--on-accent:#FFFFFF;
 --c1:#5A3FD0;--c2:#2563A8;--c3:#B0457A;--c4:#1F7A5A;--c5:#B07A0A;--c6:#C2410C;--c7:#0E7490;
 --sea:#E3ECFA;--land:#FBFAFE;--land-line:#CFC8E8;--shadow:0 4px 12px rgba(17,17,26,.06)}

body{background:linear-gradient(170deg,#FCEFF6 0%,#EFEBFF 38%,#E6F1FC 70%,#E7F7F2 100%) fixed var(--ground)}

/* はじめての案内 */
.obov{position:fixed;inset:0;z-index:70;background:var(--ground);display:grid;place-items:center;padding:24px;animation:enter .25s ease-out}

.obart{width:min(260px,70vw);aspect-ratio:1;border-radius:40%;display:grid;place-items:center;box-shadow:0 24px 60px rgba(80,60,200,.3);margin:28px 0 10px}

.obdots{display:flex;gap:6px;margin:6px 0}.obdots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}.obdots i.on{width:22px;background:#6A55E3}

/* ===== 仕上げ3：絵文字をやめて線のアイコン、色は紫と白に戻す ===== */
.li{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.day header{display:flex;flex-direction:column;gap:4px}
.dh1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dh2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dh2 h3{margin:0}
.roopen{width:40px;height:40px;border:0;border-radius:12px;background:var(--soft);color:var(--ink2);display:grid;place-items:center;cursor:pointer;margin:0;flex:none}

.dwx{display:inline-flex;align-items:center;gap:5px;margin:0;padding:3px 10px;border-radius:999px;background:var(--paper);box-shadow:0 0 0 1px rgba(17,17,26,.07);font-size:12.5px;font-weight:700;color:var(--ink2)}
.dwx b{font-family:var(--num)}.dwx i{font-style:normal;font-family:var(--num);color:var(--muted);font-weight:600}.dwx em{font-style:normal;font-size:11.5px;color:var(--accent-ink);font-weight:800}

.bkb{gap:5px;background:var(--soft);color:var(--ink2);font-weight:700}.bkb .li{color:var(--accent-ink);width:14px;height:14px}

.h2bk{display:inline-flex;align-items:center;gap:6px;color:#2A2140}.h2bk .li{color:#5A45D6}
.bkf summary{display:flex;align-items:center;gap:6px}.bkf summary .li{color:var(--accent-ink)}
.sdi .li{width:15px;height:15px}

.h2wx .i{display:grid;place-items:center}
/* はじめての案内：小さな画面の絵 */
.obart{width:min(300px,78vw);aspect-ratio:1;border-radius:36px;display:grid;place-items:center;background:linear-gradient(150deg,#EEE9FF,#E3ECFF);box-shadow:inset 0 0 0 1px rgba(17,17,26,.08);margin:28px 0 10px;padding:22px}

.oc{position:relative;height:96px;border-radius:18px;display:flex;align-items:flex-end;padding:12px 14px;color:#fff;box-shadow:0 8px 22px rgba(17,17,26,.18)}
.oc.c1{background:linear-gradient(160deg,#F2A7C1 0%,#B07AD9 55%,#5B4FD0 100%)}.oc.c2{background:linear-gradient(160deg,#9ED9C8 0%,#5DA9C9 55%,#3F5DB8 100%);transform:translateX(18px)}
.oc b{font-size:16px;font-weight:900}.oc i{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:#fff;color:#5A45D6;display:grid;place-items:center;font-style:normal;font-size:20px;font-weight:700}

.oba.dark em{font-style:normal;margin-top:10px;align-self:stretch;text-align:center;padding:9px;border-radius:999px;background:#fff;color:#4B3BC8;font-weight:800}
.ow{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px}.ow .li{width:18px;height:18px}.ow i{font-style:normal;opacity:.7}
.obov{overflow-y:auto;align-items:center;padding:max(20px,env(safe-area-inset-top)) 22px max(20px,env(safe-area-inset-bottom))}
.obart{width:min(280px,72vw,40svh);margin:12px 0 4px;padding:18px}
.obc{gap:12px}.obc h2{font-size:24px}.obc p{font-size:15px;line-height:1.75}
@media (max-height:700px){.obart{width:min(220px,60vw,34svh);padding:14px}.oba{gap:7px;font-size:12px}.oc{height:72px}.obc p{font-size:14px}}

/* ===== 理想の画像に合わせて：白い地・紫は押すところだけ ===== */
:root{--ground:#F6F7F9;--paper:#FFFFFF;--soft:#F1F2F5;--accent-soft:#F1F2F5;--line:#E7E8EC;--ink:#17171C;--ink2:#3C3D45;--muted:#6B6E78;--accent:#5B4BDB;--accent-ink:#5B4BDB;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06)}

body{background:var(--ground)!important}
body::before,body::after{display:none!important}
.card,.empty,.spot,.trip,.nowcard,.day li:not(.mv):not(.full):not(.tlh),.day li.full:has(form),.chip,.day .foot .btn{background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:var(--shadow),0 0 0 1px rgba(0,0,0,.035)}
.bar{background:rgba(255,255,255,.94)!important;box-shadow:0 1px 0 var(--line)}

.tabbar{background:rgba(255,255,255,.96)!important;box-shadow:0 -1px 0 var(--line),0 8px 30px rgba(0,0,0,.08)}

.tabbar button{color:#8A8D96}
.day ul.tl::before{background:repeating-linear-gradient(180deg,#D9DBE1 0 6px,transparent 6px 11px)}
.day li.tlh:not(:has(.tod))::before{border-color:#C9CCD3}
.tod{box-shadow:0 0 0 4px var(--ground)}
.daypills button{background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.daypills button[aria-current="true"]{background:#5B4BDB;border-color:#5B4BDB;color:#fff;box-shadow:0 6px 16px rgba(91,75,219,.25)}
.btn.fill,.btn.big.fill,.cpanel .cd button[aria-pressed="true"],.catchips button[aria-pressed="true"],.seg3 button[aria-selected="true"],.curseg button[aria-pressed="true"],.aisteps li.on i,.rainalts i,.btn.icon-only.add{background:#5B4BDB!important;box-shadow:0 6px 16px rgba(91,75,219,.22)}
.catchips button{background:var(--paper);box-shadow:0 0 0 1px var(--line);color:var(--ink2)}
.thumb.ticon,.ccn.ticon,.sdi,.rpi,.nearni{background:var(--soft)!important;color:var(--ink2)!important}
.thumb.ticon svg,.ccn.ticon svg,.nearni svg{stroke:var(--ink2)!important}
.rpi{color:#2F6FE0!important}
.exc{background:var(--soft);box-shadow:0 6px 22px rgba(0,0,0,.10)}.exc figure,.sdh,.pcf{background:#DDE1E8}
.exni{background:rgba(255,255,255,.35)}
.obart{background:#F1F2F5;box-shadow:none}
.obq{background:#5B4BDB}.obl b{color:#5B4BDB}.obr i{background:#E4E6EB}
.mhero{background:var(--paper);color:var(--ink);box-shadow:var(--shadow),0 0 0 1px rgba(0,0,0,.035)}
.mhero .ml{color:var(--muted);opacity:1}.mhero .mbig.over{color:var(--warn)}
.mmeter{background:#ECEDF1}.mmeter i{background:#5B4BDB}
.mstats span{color:var(--muted);opacity:1}

<script>
/* ================= 端末の機能を呼ぶ窓口 =================
   アプリ（Capacitor）で動いているときは iPhone の通知・共有・マップを使い、
   ブラウザでは代わりの動き（画面内の表示・コピー・Googleマップ）にする */
const Native={
  isApp:!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()),
  isIOS:/iPhone|iPad|iPod/.test(navigator.userAgent),
  plug(n){const C=window.Capacitor;if(!C)return null;return (C.Plugins&&C.Plugins[n])||(C.registerPlugin?C.registerPlugin(n):null)},
  /* 操作したときの軽い振動（iPhoneアプリのときだけ）。k: light / medium / success / warn */
  haptic(k){if(!this.isApp)return;const H=this.plug("Haptics");if(!H)return;
    try{const p=k==="success"?H.notification({type:"SUCCESS"}):k==="warn"?H.notification({type:"WARNING"}):H.impact({style:k==="medium"?"MEDIUM":"LIGHT"});if(p&&p.catch)p.catch(()=>{})}catch(e){}},
  /* 通知をすべて入れ直す。list:[{at:Date,title,body}] */
  async schedule(list){const LN=this.plug("LocalNotifications");if(!this.isApp||!LN)return false;
    try{const p=await LN.checkPermissions();if(p.display!=="granted")return "denied";
      const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
      const fut=list.filter(n=>n.at>new Date()).slice(0,60); /* iOSは同時に64件まで */
      if(fut.length)await LN.schedule({notifications:fut.map((n,i)=>({id:i+1,title:n.title,body:n.body,schedule:{at:n.at}}))});return true}catch(e){return false}},
  /* 通知の許可の状態："granted"（許可）/"denied"（拒否）/"prompt"（まだ聞いていない）/"web"（ブラウザ） */
  async perm(ask){const LN=this.plug("LocalNotifications");if(!this.isApp||!LN)return "web";
    try{let p=await LN.checkPermissions();if(ask&&p.display!=="granted"&&p.display!=="denied")p=await LN.requestPermissions();return p.display==="granted"?"granted":p.display==="denied"?"denied":"prompt"}catch(e){return "prompt"}},
  async testNotify(n){const LN=this.plug("LocalNotifications");
    if(this.isApp&&LN){try{if(await this.perm(true)!=="granted")return "denied";await LN.schedule({notifications:[{id:9999,title:n.title,body:n.body,schedule:{at:new Date(Date.now()+5000)}}]});return "app"}catch(e){return false}}
    return "web"},

    try{await navigator.clipboard.writeText(text);return "copied"}catch(e){return false}},

  mapUrl(s){return `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`}
};

/* ================= 保存（端末の中） ================= */

/* ===== 場所の写真（Wikipedia → Wikimedia Commons）。送るのは場所の名前だけ ===== */
const photoOn=()=>DB.photos!==false;
async function wapi(host,q){const r=await fetch(`https://${host}/w/api.php?`+new URLSearchParams({format:"json",formatversion:"2",origin:"*",...q}),{headers:{"Api-User-Agent":"TabiNote/1.0 (https://vivid-346.github.io/tabi-planner/app/support.html)"}});if(!r.ok)throw new Error("net");return r.json()}
const okFile=f=>/\.(jpe?g|png|webp)$/i.test(f||"")&&!/logo|locator|location|map|emblem|flag|icon|seal|symbol|diagram|plan\b|\bISS\d|aerial|satellite|gsi|空中写真|航空写真|衛星|ロゴ|地図|位置図|紋章|旗/i.test(f||"");
const freeLic=l=>/^(CC0|CC BY|Public domain|PD)/i.test(l||"");
const plain=h=>new DOMParser().parseFromString(String(h||""),"text/html").body.textContent.replace(/\s+/g," ").trim();

  const r=await wapi("commons.wikimedia.org",{action:"query",titles:files.slice(0,6).join("|"),prop:"imageinfo",iiprop:"url|extmetadata",iiurlwidth:"800",iiextmetadatafilter:"LicenseShortName|Artist"});
  const map=new Map((r.query?.normalized||[]).map(n=>[n.from,n.to]));
  for(const f of files){const pg=(r.query?.pages||[]).find(x=>x.title===(map.get(f)||f.replace(/_/g," ")));const ii=pg?.imageinfo?.[0];if(!ii)continue;
    const lic=ii.extmetadata?.LicenseShortName?.value||"";const u=ii.thumburl||ii.url||"";if(!freeLic(lic)||!/^https:\/\/(upload|thumb)\.wikimedia\.org\//.test(u))continue;

/* 1. ウィキペディアの記事の代表写真 → 2. Commons で名前を検索。ロゴ・地図・自由に使えない写真は使わない
   取り違え防止：AIが付けた記事名はそのまま使う。場所の名前で引くときは、転送・あいまいさ回避ページを使わない。
   Commons の検索結果は、ファイル名に場所の名前が入っているものだけ使う */
const squash=x=>String(x||"").normalize("NFKC").replace(/[\s_・･（）()「」『』.\-]/g,"").toLowerCase();
/* チェーン全体の写真を特定の支店の写真として表示しない。自分の写真は保持。 */
function chainPhotoUnknown(s){return /スタバ|スターバックス|starbucks/i.test(s?.name||"")}
function spotPhoto(s){return s?.photo?.u&&(!chainPhotoUnknown(s)||s.photo.own)?s.photo:null}
function placeQuery(name){return String(name||"").replace(/スタバ/g,"スターバックス")}
function chainBranchMatches(name,region,label){if(!chainPhotoUnknown({name}))return true;const detail=placeQuery(name).replace(/スターバックス(?:コーヒー)?|starbucks/ig,"").replace(region||"","").trim();const terms=detail.split(/\s+/).map(squash).filter(Boolean);return terms.every(k=>squash(label).includes(k))}

function roPlan(t,date,ids){const orig=items(t,date);const firstId=orig[0]?.id,lastId=orig[orig.length-1]?.id;
  const nonFixed=orig.filter(x=>!(x.kind==="move"&&x.arrive&&(x.id===firstId||x.id===lastId))&&timeKey(x.time)!=null);
  const dayStart=nonFixed.length?Math.min(...nonFixed.map(x=>timeKey(x.time))):9*60;
  /* 並び順の n 番目は、もとの n 番目の時刻を目安にする（食事やチェックインの時間帯を崩さない）。移動が間に合わないときだけ後ろにずらす */
  const slots=nonFixed.map(x=>timeKey(x.time)).sort((a,b)=>a-b);let n=0;
  const out=[];let cur=null,prev=null,afterFixed=false;
  for(const id of ids){const x={id,...t.items[id]};const k0=timeKey(x.time),ka=timeKey(x.arrive);
    if(x.kind==="move"&&x.arrive&&(id===firstId||id===lastId)&&k0!=null){out.push({id,time:x.time,arrive:x.arrive,fixed:true});cur=ka??k0;prev=null;afterFixed=true;continue}

function optOrder(t,ids){const pos=[],vals=[];ids.forEach((id,k)=>{const x=t.items[id];const s=x&&x.spot&&t.spots?.[x.spot];if(x&&(x.kind==="see"||x.kind==="other")&&s&&s.lat!=null){pos.push(k);vals.push(id)}});

function itemEnd(t,x){const k=timeKey(x.time);if(k==null)return null;if(x.kind==="move"){const a=timeKey(x.arrive);return a!=null&&a>=k?a:k+30}const sp=x.spot&&t.spots?.[x.spot];return k+(x.dur||sp?.minutes||60)}

function suggestSlot(t,date,s){const its=items(t,date).filter(x=>timeKey(x.time)!=null);const stay=s.minutes||60;const r15=m=>Math.ceil(m/15)*15;const loc=x=>x&&x.spot&&t.spots?.[x.spot]||null;

    const st=r15(itemEnd(t,a)+legTo(t,loc(a),s));if(st>=8*60&&st+stay+legTo(t,s,loc(b))<=timeKey(b.time)&&!conflict(t,date,pad(Math.floor(st/60))+":"+pad(st%60)))return {k:st,fit:true}}

/* 行きたい投票：共有コードに写真や位置を入れない。既存アプリへ組み込む純粋関数。 */

function voteInviteData(t){

function voteCleanInvite(o){

}
function voteCleanResponse(o){

function voteResponseTarget(trips,response,currentTid){
 const r=voteCleanResponse(response);
 const matches=Object.entries(trips||{}).filter(([,t])=>t.sid===r.t);
 if(!matches.length)return {kind:'missing'};
 // 同じ旅行を複製した場合も勝手に他のコピーへ反映しない。
 const current=matches.find(([id])=>id===currentTid);
 if(current)return {kind:'current',tid:current[0]};
 return {kind:'confirm',choices:matches.map(([id,t])=>({id,title:String(t.title||'旅行')}))};
}
function voteApplyResponse(t,response,replaceRid){
 const r=voteCleanResponse(response);if(t.sid!==r.t)throw new Error('trip');
 const old=t.votes||{};
 const sameName=Object.entries(old).find(([id,x])=>id!==r.r&&x&&voteName(x.n)===r.n);
 if(sameName&&replaceRid!==sameName[0])return {confirm:sameName[0],name:r.n};
 let missing=0;const a=r.a.filter(([id])=>{if(Object.hasOwn(t.spots||{},id))return true;missing++;return false});
 // 戻り値だけを作り、保存成功まで元の旅行を変更しない。
 const votes={...old};if(sameName)delete votes[sameName[0]];
 votes[r.r]={n:r.n,a};return {votes,missing,replaced:!!old[r.r]||!!sameName};
}
function voteCounts(t){
 const counts=Object.create(null);for(const id of Object.keys(t.spots||{}))counts[id]=0;
 for(const [rid,x] of Object.entries(t.votes||{})){if(!voteSafeId(rid)||!x||!Array.isArray(x.a))continue;const seen=new Set();for(const pair of x.a){if(!Array.isArray(pair))continue;const [id,v]=pair;if(seen.has(id))continue;seen.add(id);if(v===1&&Object.hasOwn(counts,id))counts[id]++}}
 return counts;
}

async function voteSend(title,message){S.codeOut=message;draw();const r=await Native.share(title,message);if(r==='copied')toast('コピーしました。LINEなどに貼って送れます');else if(!r)toast('下のコードをコピーして送ってください')}
async function voteReceive(code){const r=await unpackCode(code);if(r.kind==='VOTE'){const invite=voteCleanInvite(r.data);S.voteFriend={invite,answers:{},name:votePerson().name};S.voteImport=null;S.imp=null;S.codeOut=null;draw();window.scrollTo(0,0);return true}
 if(r.kind==='ANSWER'){S.voteImport={response:voteCleanResponse(r.data)};S.voteFriend=null;S.imp=null;S.codeOut=null;draw();window.scrollTo(0,0);return true}return false}
async function voteAction(a,b){const id=b.dataset.id;
 switch(a){
 case 'voteInvite':{const t=T();if(!t.sid&&!change('',x=>x.sid=uid(),true))return true;try{const data=voteInviteData(T());const code=await packCode('VOTE',data);await voteSend('みんなに聞く',`「${data.n}」の行きたい場所を選んでください。旅のノートの「受け取った旅行を取り込む」に、このメッセージを貼ってください。\n\n${code}`)}catch(e){toast(e.message==='limit'?'一度に聞ける候補は500件までです。候補を整理してから、もう一度押してください':'候補を追加してから、みんなに聞いてください')}return true}
 case 'voteImport':S.voteImport={text:''};S.codeOut=null;draw();window.scrollTo(0,0);return true;
 case 'voteRead':{const text=$('vote_text').value;S.voteImport.text=text;try{if(!await voteReceive(text))toast('投票お願いコードか回答コードを貼ってください')}catch(e){toast('投票コードを読めませんでした。メッセージをまるごと貼り直してください')}return true}
 case 'voteChoose':if(S.voteFriend){S.voteFriend.name=$('vote_name').value;S.voteFriend.answers[id]=+b.dataset.value;S.codeOut=null;draw()}return true;
 case 'voteAnswer':{const f=S.voteFriend;if(!f)return true;f.name=$('vote_name').value;try{const p=voteRemember(f.name),r=voteResponseData(f.invite,p.id,f.name,f.answers);await voteSend('行きたい場所の回答',`${r.n}の回答です。旅のノートの「回答コードを読み込む」に貼ってください。\n\n${await packCode('ANSWER',r)}`)}catch(e){toast(e.message==='unanswered'?'すべての場所で、行きたい・どっちでも・パスを選んでください':'ニックネームを入れてください')}return true}
 case 'voteApply':{const v=S.voteImport;if(!v?.response)return true;const target=voteResponseTarget(DB.trips,v.response,S.tid);const allowed=target.kind==='current'?target.tid===id:target.kind==='confirm'&&target.choices.some(x=>x.id===id);if(!allowed){toast('この回答の旅行が見つかりません');return true}
 const x=voteApplyResponse(DB.trips[id],v.response,v.replace);if(x.confirm){v.replace=x.confirm;draw();return true}const previous=S.tid;S.tid=id;if(!change('回答を取り込みました',t=>t.votes=x.votes,true)){S.tid=previous;return true}S.voteImport=null;S.imp=null;S.tab='spots';S.q='';S.cat='';S.detail=null;S.ai=null;draw();toast(x.missing?`回答を取り込みました。${x.missing}件は候補が見つかりませんでした`:x.replaced?'新しい回答に置き換えました':'回答を取り込みました',true);return true}
 case 'voteSort':S.voteSort=!S.voteSort;draw();return true;
 case 'voteCancel':S.voteFriend=null;S.voteImport=null;S.codeOut=null;draw();return true;
 }return false;
}

    "booking": false, "minutes": 60, "rain_ok": false } ]${kind==="plan"?`,
  "costs": { "transport": {"min":0,"max":0,"note":"往復と現地移動の前提"}, "hotel": {"min":0,"max":0,"note":"全泊分"}, "food": {"min":0,"max":0,"note":"全日分"}, "other": {"min":0,"max":0,"note":"観光・体験"} }`:""}

      if(n&&'"\\/bfnrtu'.includes(n)){out+=c+n;i++;continue}
      if(n&&/[\[\]{}_*#\x60>!~()-]/.test(n)){out+=n;i++;continue}

      if(c==="\\"){esc=true;if(!skip)out+=c;continue}
      if(c==='"'){inStr=false;skip=false;out+=c;continue}
      if(c==="\n"||c==="\r"){if(skip)continue;if(/[。．.!！?？)）]\s*$/.test(cur))skip=true;else{out+=" ";cur+=" "}continue}

    if(c==='"'){inStr=true;cur="";out+=c;continue}
